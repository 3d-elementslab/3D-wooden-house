<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Elements Lab Hero Cube</title>
  <style>
  * {
    box-sizing: border-box;
  }
  html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* 完美對齊上方 WordPress 的 #edf2f7，中間自然過渡，底部收在柔和的鼠尾草綠 #aec3b0 */
  background: 
    linear-gradient(to bottom, #edf2f7 0%, #cbd5e1 50%, #aec3b0 100%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: #f1f5f9;
}
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }
  .hero-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
    width: 100%;
    padding: 0 20px;
  }
  .hero-overlay h1 {
    color: #0f172a;
    font-size: clamp(2.2rem, 4.5vw, 3.5rem);
    font-weight: 700;
    margin: 0 0 16px 0;
    letter-spacing: 3px;
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.7);
  }
  .hero-overlay p {
    /* 放大字體尺寸，讓副標存在感更協調 */
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    margin: 0;
    letter-spacing: 4px;
    text-transform: uppercase;
    /* 改用金屬感深藍銀色漸層與高質感文字陰影取代死板的純黑 */
    background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #64748b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 8px rgba(255, 255, 255, 0.6);
  }
</style>
</head>
<body>

 
  <!-- 依序動態載入 Three.js 與外掛 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
  
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 金屬髮絲紋理
    function createBrushedTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#888888'; ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 6000; i++) {
        const y = Math.random() * 256;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.18})`;
        ctx.fillRect(0, y, 256, 1);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      return texture;
    }
    const brushedTex = createBrushedTexture();

    const logoGroup = new THREE.Group();
    logoGroup.scale.set(0.2, 0.2, 0.2);
    scene.add(logoGroup);

    const loader = new THREE.GLTFLoader();

    // 材質設定
    const elMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xd6b06b, metalness: 0.92, roughness: 0.28, roughnessMap: brushedTex, envMapIntensity: 1.40, clearcoat: 0.3
    });

    const cubeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x6ea6be, metalness: 0.75, roughness: 0.22, roughnessMap: brushedTex, clearcoat: 0.85, clearcoatRoughness: 0.1, envMapIntensity: 1.35
    });

    // 載入 EL.glb 與 cubes.glb
    loader.load('EL.glb?v=' + Date.now(), (gltf) => {
      gltf.scene.traverse(n => { if (n.isMesh) n.material = elMaterial; });
      gltf.scene.position.set(-2, 0, -2);
      logoGroup.add(gltf.scene);
    });

    loader.load('cubes.glb?v=' + Date.now(), (gltf) => {
      gltf.scene.traverse(n => {
        if (n.isMesh) {
          n.material = cubeMaterial;
          n.geometry.computeVertexNormals();
        }
      });
      logoGroup.add(gltf.scene);
    });

    // 動畫迴圈（包含 X、Y、Z 三軸搖擺與自轉）
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      
      logoGroup.rotation.x = Math.sin(t * 0.4) * 0.6;
      logoGroup.rotation.y += 0.002;
      logoGroup.rotation.z = Math.sin(t * 0.5) * 0.5;

      logoGroup.position.x = Math.sin(t * 0.5) * 6;
      logoGroup.position.y = Math.sin(t * 0.8) * 5;
      logoGroup.position.z = Math.cos(t * 0.5) * 3;

      renderer.render(scene, camera);
    }
    animate();

    // 視窗縮放適應
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
