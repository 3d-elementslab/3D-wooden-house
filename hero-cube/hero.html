<div id="wp-hero-container" style="position: relative; width: 100vw; height: 300vh; overflow: hidden; background: linear-gradient(135deg, #e8edf3 0%, #b8c7d8 100%); margin: 0; padding: 0;">
</div>

<script>
(function() {
  const container = document.getElementById('wp-hero-container');
  if (!container) return;
  
  // 防止 WordPress 編輯器局部重繪時重複建立多個 canvas 畫布
  if (container.dataset.loaded === "true") return;
  container.dataset.loaded = "true";
  container.innerHTML = ""; // 清空舊畫面

  // 動態載入 Three.js 核心與外掛（確保腳本完整載入且不被干擾）
  function loadScript(url, callback) {
    if (document.querySelector(`script[src="${url}"]`)) {
      if (callback) callback();
      return;
    }
    const script = document.createElement('script');
    script.src = url;
    script.onload = callback;
    document.head.appendChild(script);
  }

  loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', () => {
    loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js', () => {
      loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js', init3D);
    });
  });

  function init3D() {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 動態產生金屬髮絲紋理（確保模型與背景完美交疊時邊緣清晰）
    function createBrushedTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#888888'; ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 6000; i++) {
        const y = Math.random() * 256;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.18})`;
        ctx.fillRect(0, y, 256, 1);
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      return texture;
    }
    const brushedTex = createBrushedTexture();

    const logoGroup = new THREE.Group();
    logoGroup.scale.set(0.25, 0.25, 0.25);
    scene.add(logoGroup);

    const loader = new THREE.GLTFLoader();

    // 材質設定（香檳金 EL 與 冰河藍 Cubes）
    const elMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xd6b06b, metalness: 0.92, roughness: 0.28, roughnessMap: brushedTex, envMapIntensity: 1.40, clearcoat: 0.3
    });

    const cubeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x6ea6be, metalness: 0.75, roughness: 0.22, roughnessMap: brushedTex, clearcoat: 0.85, clearcoatRoughness: 0.1, envMapIntensity: 1.35
    });

    // 載入 EL 字體模型 (帶防快取時間戳記)
    loader.load('https://3d.elementslab.net/hero-cube/EL.glb?v=' + Date.now(), (gltf) => {
      gltf.scene.traverse(n => { if (n.isMesh) n.material = elMaterial; });
      gltf.scene.position.set(-2, 0, -2);
      logoGroup.add(gltf.scene);
    });

    // 載入 Cubes 模型 (帶防快取時間戳記)
    loader.load('https://3d.elementslab.net/hero-cube/cubes.glb?v=' + Date.now(), (gltf) => {
      gltf.scene.traverse(n => {
        if (n.isMesh) {
          n.material = cubeMaterial;
          n.geometry.computeVertexNormals();
        }
      });
      logoGroup.add(gltf.scene);
    });

    // 動態漫遊與旋轉動畫
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      logoGroup.rotation.x = Math.sin(t * 0.4) * 0.6;
      logoGroup.rotation.y += 0.003;
      renderer.render(scene, camera);
      
      logoGroup.position.x = Math.sin(t * 0.5) * 1;     
      logoGroup.position.y = Math.sin(t * 0.8) * 0.8;     
      logoGroup.position.z = Math.cos(t * 0.5) * 1.2;     
    
    }
    animate();

    // 響應視窗與容器大小調整
    window.addEventListener('resize', () => {
      if (!container) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  }
})();
</script>
