<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>Elements Lab - 3D Logo Cube Showcase</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    
    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 60%, #050811 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #f1f5f9;
    }

    #metal-frame {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.15),
        inset 0 0 0 2px rgba(51, 65, 85, 0.4),
        0 0 0 1px rgba(15, 23, 42, 0.85);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      position: relative;
      z-index: 5;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    
    .brand-link {
      text-decoration: none;
      pointer-events: auto;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #f8fafc;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
    }

    .brand-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background-color: #d8b370;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0.8;
    }

    .brand-link:hover .brand-title {
      color: #d8b370;
    }

    .brand-link:hover .brand-title::after {
      transform: scaleX(1);
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    footer {
      position: absolute;
      bottom: 0.9rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #64748b;
      pointer-events: auto;
      z-index: 20;
      line-height: 1.5;
    }

    footer .studio-link {
      color: #94a3b8;
      text-decoration: none;
      position: relative;
      display: inline-block;
      font-weight: 500;
    }

    footer .studio-link:hover {
      color: #d8b370;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="metal-frame"></div>

  <header>
    <div>
      <a href="https://3d.elementslab.net" class="brand-link">
        <div class="brand-title">3D ELEMENTS LAB</div>
      </a>
      <div class="brand-sub">Quiet Luxury Metal Showcase</div>
    </div>
  </header>

  <canvas id="webgl-canvas"></canvas>

  <footer>
    <div>© 2026 Elements Lab. All rights reserved.</div>
    <div><a href="https://elementslab.net" class="studio-link">實驗元素工作室</a></div>
  </footer>

  <script>
    // 建立精準無綠色色偏的高級珠寶攝影棚環境反射貼圖（純中性白、香檳金與冷灰色階）
    function buildCleanStudioEnv(renderer) {
      const envCanvas = document.createElement('canvas');
      envCanvas.width = 512;
      envCanvas.height = 256;
      const ctx = envCanvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, 256);
      bgGrad.addColorStop(0.0, '#f8fafc');
      bgGrad.addColorStop(0.3, '#94a3b8');
      bgGrad.addColorStop(0.5, '#334155');
      bgGrad.addColorStop(0.7, '#64748b');
      bgGrad.addColorStop(1.0, '#0f172a');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 256);

      // 乾淨的頂部柔光條（模擬無色差攝影棚打燈）
      const strips = [
        { x: 80, w: 40, alpha: 0.9 },
        { x: 220, w: 60, alpha: 1.0 },
        { x: 380, w: 40, alpha: 0.9 }
      ];
      strips.forEach((s) => {
        const g = ctx.createLinearGradient(s.x, 0, s.x + s.w, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.5, `rgba(255, 255, 255, ${s.alpha})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(s.x, 0, s.w, 256);
      });

      const equirectTex = new THREE.CanvasTexture(envCanvas);
      equirectTex.mapping = THREE.EquirectangularReflectionMapping;

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      const envRT = pmremGenerator.fromEquirectangular(equirectTex);
      equirectTex.dispose();
      pmremGenerator.dispose();
      return envRT.texture;
    }

    // 製作極細緻的高級金屬拉絲紋理 (Brushed Metal Texture)
    function createBrushedMetalTexture() {
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 256;
      texCanvas.height = 256;
      const ctx = texCanvas.getContext('2d');

      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 256, 256);

      for (let y = 0; y < 256; y++) {
        const shade = Math.floor(100 + Math.random() * 55);
        ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
        ctx.fillRect(0, y, 256, 1);
      }

      const tex = new THREE.CanvasTexture(texCanvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 16); // 垂直拉絲細紋
      return tex;
    }

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const isMobile = window.innerWidth <= 768;
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 200);
    // 固定相機位置，完美對齊參考圖的黃金鏡頭視角
    camera.position.set(0, 1.4, 7.5);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const studioEnvMap = buildCleanStudioEnv(renderer);

    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.0;
    controls.maxDistance = 30.0;
    controls.target.set(0, 0, 0);

    // 純淨無色差的三點專業珠寶打光（主光、補光、輪廓光，完全排除綠色反光）
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    
    const keyLight = new THREE.DirectionalLight(0xfffbeb, 2.0); // 暖白主光
    keyLight.position.set(6, 12, 8);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xe0f2fe, 1.2); // 冷白輪廓光
    rimLight.position.set(-8, -4, -6);
    scene.add(rimLight);

    const frontLight = new THREE.DirectionalLight(0xffffff, 0.7); // 正面柔和補光
    frontLight.position.set(0, 4, 10);
    scene.add(frontLight);

    const brushedRoughnessMap = createBrushedMetalTexture();

    // 1. 參考圖等級的香檳金金屬材質 (EL 字母專用)
    const referenceGoldMat = new THREE.MeshPhysicalMaterial({
      color: 0xdfbe7e,          // 精準香檳金色調
      metalness: 0.88,
      roughness: 0.32,
      roughnessMap: brushedRoughnessMap,
      clearcoat: 0.4,
      clearcoatRoughness: 0.15,
      envMap: studioEnvMap,
      envMapIntensity: 1.25
    });

    // 2. 高級霧面冰河藍材質 (Cubes 方塊專用)
    const referenceGlacierMat = new THREE.MeshPhysicalMaterial({
      color: 0x93b5c6,          // 柔和高級感冰河藍
      metalness: 0.25,
      roughness: 0.45,
      clearcoat: 0.6,
      clearcoatRoughness: 0.2,
      envMap: studioEnvMap,
      envMapIntensity: 1.0
    });

    // 載入整合好的 EL Cubes.glb
    const loader = new THREE.GLTFLoader();
    loader.load(
      './EL%20Cubes.glb',
      (gltf) => {
        const root = gltf.scene;
        root.updateMatrixWorld(true);

        // 自動置中與縮放
        const box = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        const targetScale = ((isMobile ? 2.0 : 2.3) / (maxDim || 1)) * 0.75;
        root.scale.setScalar(targetScale);
        root.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        scaledBox.getCenter(center);
        root.position.sub(center);
        root.updateMatrixWorld(true);

        // 精準對應材質
        root.traverse((node) => {
          if (node.isMesh) {
            const origName = (node.material && node.material.name) ? node.material.name : '';
            const isGold = origName.includes('0.700') || (node.parent && node.parent.name === 'EL' && !origName.includes('0.820'));

            if (isGold) {
              node.material = referenceGoldMat;
            } else {
              node.material = referenceGlacierMat;
            }
          }
        });

        modelRoot.add(root);
      },
      undefined,
      (error) => { console.error("EL Cubes Load Error:", error); }
    );

    // ★ 關鍵：直接將模型初始角度旋轉對齊，讓它一進來就完美正對鏡頭（呈現參考圖的角度）
    modelRoot.rotation.set(0.32, -0.78, 0.05);

    // 動畫循環
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 視窗縮放適應
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
