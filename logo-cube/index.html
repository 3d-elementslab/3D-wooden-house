<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elements Lab - 3D Logo Cube Assembly (Quiet Luxury Edition)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #8fa0b5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
    }

    #metal-frame {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    
    .brand-link {
      text-decoration: none;
      pointer-events: auto;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      transition: color 0.2s ease;
    }

    .brand-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background-color: #0f172a;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
      opacity: 0.6;
    }

    .brand-link:hover .brand-title {
      color: #ebd2a0;
    }

    .brand-link:hover .brand-title::after {
      transform: scaleX(1);
      background-color: #ebd2a0;
      opacity: 1;
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #475569;
      margin-top: 0.2rem;
    }

    #ui-control-bar {
      position: absolute;
      bottom: 3.8rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
      align-items: center;
      padding: 0.5rem 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(226,232,240,0.7) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 
        0 8px 24px rgba(15, 23, 42, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      z-index: 20;
    }

    .action-btn {
      width: 135px;
      height: 42px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8fafc;
      background: linear-gradient(180deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid #475569;
      border-bottom: 2px solid #020617;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 
        0 3px 8px rgba(15, 23, 42, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.12s ease;
    }
    .action-btn:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 50%, #1e293b 100%);
    }
    .action-btn:active {
      transform: translateY(2px);
      border-bottom: 1px solid #020617;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.3),
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    footer {
      position: absolute;
      bottom: 0.9rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #475569;
      pointer-events: auto;
      z-index: 20;
      line-height: 1.5;
    }

    footer .studio-link {
      color: #334155;
      text-decoration: none;
      position: relative;
      display: inline-block;
      font-weight: 500;
      transition: color 0.25s ease;
    }

    footer .studio-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 1px;
      background-color: #334155;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease;
      opacity: 0.6;
    }

    footer .studio-link:hover {
      color: #bfa16b;
    }

    footer .studio-link:hover::after {
      transform: scaleX(1);
      background-color: #bfa16b;
      opacity: 1;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="metal-frame"></div>

  <header>
    <div>
      <a href="https://3d.elementslab.net" class="brand-link">
        <div class="brand-title">3D ELEMENTS LAB</div>
      </a>
      <div class="brand-sub">Modular Assembly Simulator</div>
    </div>
  </header>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-control-bar">
    <button class="action-btn" id="btn-flyin">FLY IN</button>
    <button class="action-btn" id="btn-play">PLAY & HIT</button>
  </div>

  <footer>
    <div>© 2026 Elements Lab. All rights reserved.</div>
    <div><a href="https://elementslab.net" class="studio-link">實驗元素工作室</a></div>
  </footer>

  <script>
    // --- 1. Three.js 場景建構 ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);

    const isMobile = window.innerWidth <= 768;
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 150);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 1.2, 8.2);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35; // 稍微拉高環境曝光，提升金屬高光通透感

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2.0;  // 允許玩家拉得非常近
    controls.maxDistance = 35.0; // 允許玩家縮得極小享受漂浮樂趣
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 2.0));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(12, 18, 12);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x64748b, 1.8);
    fillLight.position.set(-12, 4, -8);
    scene.add(fillLight);
    const bottomBounce = new THREE.DirectionalLight(0xcbd5e1, 1.2);
    bottomBounce.position.set(0, -8, 0);
    scene.add(bottomBounce);

    // --- 2. 高級金屬材質（調高金屬感與細緻高光，去除塑膠感） ---
    const champagneGoldMat = new THREE.MeshStandardMaterial({
      color: 0xecd6a8,
      metalness: 0.92, // 提升金屬感
      roughness: 0.18, // 降低粗糙度，營造精緻鏡面反射
    });

    const anodizedTealMat = new THREE.MeshStandardMaterial({
      color: 0x3f6b98,
      metalness: 0.75, // 提升青藍金屬感
      roughness: 0.22,
    });

    const cleanWhiteWireMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.85,
    });

    const partRegistry = new Map();
    const activeTweens = [];
    let assembledCount = 15;
    const TOTAL_PARTS = 15;
    const HOME_ROTATION = { x: 0.25, y: -0.65 };

    const trajectoryMap = {
      'E': new THREE.Vector3(0, 45, 15),
      'L': new THREE.Vector3(0, -45, 15),
      'cube01': new THREE.Vector3(-45, 30, 30),
      'cube02': new THREE.Vector3(45, 35, -35),
      'cube03': new THREE.Vector3(-50, -25, -25),
      'cube04': new THREE.Vector3(40, -30, 40),
      'cube05': new THREE.Vector3(-35, 45, -30),
      'cube06': new THREE.Vector3(50, 25, 30),
      'cube07': new THREE.Vector3(-45, -35, 30),
      'cube08': new THREE.Vector3(35, -45, -35),
      'cube09': new THREE.Vector3(-55, 0, 10),
      'cube10': new THREE.Vector3(55, 0, -10),
      'cube11': new THREE.Vector3(0, 10, 50),
      'cube12': new THREE.Vector3(0, -10, -50),
      'cube13': new THREE.Vector3(35, 35, 35)
    };

    // 精準校正各零件到位時的微視角，消除 cube03 憑空感與對位不順
    const faceRotationMap = {
      'E': { x: 0.25, y: -0.65 },
      'L': { x: 0.25, y: -0.65 },
      'cube01': { x: 0.20, y: -0.95 },
      'cube02': { x: -0.30, y: 2.15 },
      'cube03': { x: 0.40, y: -2.10 }, // 優化 cube03 登場銜接視角
      'cube04': { x: 0.25, y: 0.80 },
      'cube05': { x: -0.50, y: 0.55 },
      'cube06': { x: 0.50, y: 3.14 },
      'cube07': { x: 0.20, y: -2.75 },
      'cube08': { x: 0.30, y: -1.80 },
      'cube09': { x: 0.30, y: -1.80 },
      'cube10': { x: 0.25, y: 0.80 },
      'cube11': { x: 0.25, y: -0.65 },
      'cube12': { x: 0.30, y: 2.40 },
      'cube13': { x: -0.40, y: 0.25 }  // 優化 cube13 俐落定位
    };

    // --- 3. 載入模型（開場完美呈現工程圖純白線框風格） ---
    const loader = new THREE.GLTFLoader();
    loader.load(
      './el-logo asm.glb',
      (gltf) => { initAssemblyScene(gltf); },
      undefined,
      (error) => { console.error("GLB Load Error:", error); }
    );

    function initAssemblyScene(gltf) {
      try {
        const root = gltf.scene;
        const targetPartNames = new Set([
          'E', 'L', 'cube01', 'cube02', 'cube03', 'cube04', 'cube05',
          'cube06', 'cube07', 'cube08', 'cube09', 'cube10', 'cube11', 'cube12', 'cube13'
        ]);

        root.traverse((node) => {
          if (targetPartNames.has(node.name)) {
            const isLogoLetter = (node.name === 'E' || node.name === 'L');
            const solidMat = isLogoLetter ? champagneGoldMat.clone() : anodizedTealMat.clone();

            const meshes = [];
            const wireframes = [];

            node.traverse((child) => {
              if (child.isMesh) {
                child.material = solidMat;
                meshes.push(child);

                const edges = new THREE.EdgesGeometry(child.geometry, 45);
                const wire = new THREE.LineSegments(edges, cleanWhiteWireMat);
                wire.position.copy(child.position);
                wire.rotation.copy(child.rotation);
                wire.scale.copy(child.scale);
                child.parent.add(wire);
                wireframes.push(wire);
              }
            });

            const targetPos = node.position.clone();
            const deepSpaceDir = trajectoryMap[node.name] || new THREE.Vector3(40, 30, 35);
            const hiddenDeepSpacePos = targetPos.clone().add(deepSpaceDir);

            // ★ 開場白亮點：完美復刻 CAD 工程圖純白線框風格，實體隱藏
            node.position.copy(targetPos);
            node.scale.setScalar(1.0); 
            node.visible = true;
            meshes.forEach(m => m.visible = false);
            wireframes.forEach(w => w.visible = true);

            partRegistry.set(node.name, {
              node: node,
              meshes: meshes,
              wireframes: wireframes,
              targetPos: targetPos,
              deepSpacePos: hiddenDeepSpacePos,
              isAssembled: false // 初始狀態為未組裝（線框開場）
            });
          }
        });

        root.updateMatrixWorld(true);
        const originalBox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        originalBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        // ★ 把整體方塊尺寸再縮小 18%，更顯優雅精緻
        const targetScale = ((isMobile ? 2.0 : 2.3) / (maxDim || 1)) * 0.82;
        root.scale.setScalar(targetScale);
        root.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        scaledBox.getCenter(center);
        root.position.sub(center);
        root.updateMatrixWorld(true);

        cubeRoot.add(root);
        cubeRoot.rotation.set(HOME_ROTATION.x, HOME_ROTATION.y, 0);
      } catch(err) {
        console.error("Assembly Init Error:", err);
      }
    }

    function resetCameraAndPosition(duration = 320) {
      const startCamPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const startCubePos = cubeRoot.position.clone();
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(startCamPos, DEFAULT_CAM_POS, ease);
          controls.target.lerpVectors(startTarget, new THREE.Vector3(0, 0, 0), ease);
          cubeRoot.position.lerpVectors(startCubePos, new THREE.Vector3(0, 0, 0), ease);
          controls.update();
          return t < 1;
        }
      });
    }

    function smoothRotateCubeTo(targetRot, duration = 280, onComplete = null) {
      const startRotX = cubeRoot.rotation.x;
      const startRotY = cubeRoot.rotation.y;
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          cubeRoot.rotation.x = THREE.MathUtils.lerp(startRotX, targetRot.x, ease);
          cubeRoot.rotation.y = THREE.MathUtils.lerp(startRotY, targetRot.y, ease);
          if (t >= 1 && onComplete) onComplete();
          return t < 1;
        }
      });
    }

    let flyInSequenceCounter = 0;

    function flyInSinglePart(name, isBatch = false, delayMs = 0) {
      const item = partRegistry.get(name);
      if (!item || item.isAssembled) return;

      flyInSequenceCounter++;
      // ★ 確實修復：每四次（第 4、8、12 次）觸發高空掉落惡作劇
      const isPrankDrop = isBatch && (flyInSequenceCounter % 4 === 0);

      setTimeout(() => {
        item.isAssembled = true;
        item.node.visible = true;
        item.meshes.forEach(m => m.visible = true);
        item.wireframes.forEach(w => w.visible = false); // 組裝時顯示實體金屬

        if (!isBatch && faceRotationMap[name]) {
          smoothRotateCubeTo(faceRotationMap[name], 280);
        }

        const node = item.node;
        const targetPos = item.targetPos.clone();
        const startPos = item.deepSpacePos.clone();
        let actualStartPos = startPos;
        if (isPrankDrop) {
          actualStartPos = targetPos.clone().add(new THREE.Vector3(0, 20, 0));
        }

        const startTime = performance.now();
        const duration = isPrankDrop ? 320 : (isBatch ? 350 : 380);

        activeTweens.push({
          update(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1);
            let ease = isPrankDrop ? (t * t) : (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));
            
            node.position.lerpVectors(actualStartPos, targetPos, ease);
            node.scale.setScalar(THREE.MathUtils.lerp(0.85, 1.0, ease));

            if (t >= 1) {
              node.position.copy(targetPos);
              node.scale.setScalar(1.0);
              assembledCount++;

              if (assembledCount === TOTAL_PARTS) {
                smoothRotateCubeTo(HOME_ROTATION, 350);
              }
              return false;
            }
            return true;
          }
        });
      }, delayMs);
    }

    const btnFlyIn = document.getElementById('btn-flyin');
    const btnPlay = document.getElementById('btn-play');
    const partOrder = ['E', 'L', 'cube01', 'cube02', 'cube
