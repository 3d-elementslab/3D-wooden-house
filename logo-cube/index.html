<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elements Lab - 3D Logo Cube Assembly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
    }

    #metal-frame {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.8),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #64748b;
      margin-top: 0.2rem;
    }

    #ui-control-bar {
      position: absolute;
      bottom: 3.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
      align-items: center;
      padding: 0.5rem 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(226,232,240,0.7) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 
        0 8px 24px rgba(15, 23, 42, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      z-index: 20;
    }

    .action-btn {
      width: 135px;
      height: 42px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8fafc;
      background: linear-gradient(180deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid #475569;
      border-bottom: 2px solid #020617;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 
        0 3px 8px rgba(15, 23, 42, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.12s ease;
    }
    .action-btn:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 50%, #1e293b 100%);
    }
    .action-btn:active {
      transform: translateY(2px);
      border-bottom: 1px solid #020617;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.3),
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    footer {
      position: absolute;
      bottom: 0.9rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: #64748b;
      pointer-events: none;
      z-index: 10;
      line-height: 1.2;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="metal-frame"></div>

  <header>
    <div>
      <div class="brand-title">ELEMENTS LAB</div>
      <div class="brand-sub">Modular Assembly Simulator</div>
    </div>
  </header>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-control-bar">
    <button class="action-btn" id="btn-flyin">FLY IN</button>
    <button class="action-btn" id="btn-play">PLAY & HIT</button>
  </div>

  <footer>
    © 2026 Elements Lab. All rights reserved.
  </footer>

  <script>
    // --- 1. 音效引擎：全面柔化音量，杜絕雙重疊加轟頭 ---
    const AudioEngine = {
      ctx: null,
      snapAudio: null,
      whooshAudio: null,
      dropAudio: null,
      hasPreloaded: false,
      init() {
        try {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          if (!this.snapAudio) {
            this.snapAudio = new Audio('./snap.wav');
            this.snapAudio.preload = 'auto';
            this.snapAudio.onerror = () => { this.snapAudio = new Audio('./snap.mp3'); };
          }
          if (!this.whooshAudio) {
            this.whooshAudio = new Audio('./whoosh.wav');
            this.whooshAudio.preload = 'auto';
            this.whooshAudio.onerror = () => { this.whooshAudio = new Audio('./whoosh.mp3'); };
          }
          if (!this.dropAudio) {
            this.dropAudio = new Audio('./drop.wav');
            this.dropAudio.preload = 'auto';
            this.dropAudio.onerror = () => {
              this.dropAudio = new Audio('./dorp.wav');
              this.dropAudio.onerror = () => { this.dropAudio = new Audio('./drop.mp3'); };
            };
          }

          if (!this.hasPreloaded && this.snapAudio) {
            this.snapAudio.load();
            this.hasPreloaded = true;
          }
        } catch(e) {}
      },
      vibrate(pattern = [30, 15, 45]) {
        try {
          if (typeof navigator !== 'undefined' && navigator.vibrate) {
            navigator.vibrate(pattern);
          }
        } catch(e) {}
      },
      playWhoosh() {
        this.init();
        if (this.whooshAudio) {
          const sound = this.whooshAudio.cloneNode();
          sound.volume = 0.22; // 柔和微風呼嘯
          sound.play().catch(() => {});
        }
      },
      playSnap(isFinalFlyIn = false) {
        this.init();
        if (this.snapAudio) {
          const sound = this.snapAudio.cloneNode();
          // 單塊手動 0.35，最終大合體 0.45，清脆溫和不轟耳
          sound.volume = isFinalFlyIn ? 0.45 : 0.35;
          sound.play().catch(() => {
            this.playSynthesizedSnap(isFinalFlyIn);
          });
        } else {
          this.playSynthesizedSnap(isFinalFlyIn);
        }
        this.vibrate(isFinalFlyIn ? [40, 20, 60] : [25, 10, 35]);
      },
      playSynthesizedSnap(isFinal) {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const gainMult = isFinal ? 0.45 : 0.3;

          [2400, 3600].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.25, now + 0.06);

            gain.gain.setValueAtTime((0.15 / (idx + 1)) * gainMult, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.07);
          });

          const bassOsc = this.ctx.createOscillator();
          const bassGain = this.ctx.createGain();
          bassOsc.type = 'sine';
          bassOsc.frequency.setValueAtTime(220, now);
          bassOsc.frequency.exponentialRampToValueAtTime(45, now + 0.12);

          bassGain.gain.setValueAtTime(0.35 * gainMult, now);
          bassGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

          bassOsc.connect(bassGain);
          bassGain.connect(this.ctx.destination);
          bassOsc.start(now);
          bassOsc.stop(now + 0.13);
        } catch(e) {}
      },
      playDropSound() {
        this.init();
        if (this.dropAudio) {
          const sound = this.dropAudio.cloneNode();
          sound.volume = 0.4; // 溫和滑稽聲
          sound.play().catch(() => {});
        }
      },
      playCrash() {
        this.init();
        if (!this.ctx) return;
