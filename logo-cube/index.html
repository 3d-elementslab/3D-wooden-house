<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>Elements Lab - 3D Logo Cube Showcase</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #8fa0b5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
    }

    #metal-frame {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      position: relative;
      z-index: 5;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    
    .brand-link {
      text-decoration: none;
      pointer-events: auto;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
    }

    .brand-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background-color: #0f172a;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0.6;
    }

    .brand-link:hover .brand-title {
      color: #d8b370;
    }

    .brand-link:hover .brand-title::after {
      transform: scaleX(1);
      background-color: #d8b370;
      opacity: 1;
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #475569;
      margin-top: 0.2rem;
    }

    footer {
      position: absolute;
      bottom: 0.9rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #475569;
      pointer-events: auto;
      z-index: 20;
      line-height: 1.5;
    }

    footer .studio-link {
      color: #334155;
      text-decoration: none;
      position: relative;
      display: inline-block;
      font-weight: 500;
    }

    footer .studio-link:hover {
      color: #d8b370;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="metal-frame"></div>

  <header>
    <div>
      <a href="https://3d.elementslab.net" class="brand-link">
        <div class="brand-title">3D ELEMENTS LAB</div>
      </a>
      <div class="brand-sub">Integrated Metal Showcase</div>
    </div>
  </header>

  <canvas id="webgl-canvas"></canvas>

  <footer>
    <div>© 2026 Elements Lab. All rights reserved.</div>
    <div><a href="https://elementslab.net" class="studio-link">實驗元素工作室</a></div>
  </footer>

  <script>
    // 產生珠寶級環境反射貼圖
    function buildJewelryStudioEnv(renderer) {
      const envCanvas = document.createElement('canvas');
      envCanvas.width = 512;
      envCanvas.height = 256;
      const ctx = envCanvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, 256);
      bgGrad.addColorStop(0.0, '#ffffff');
      bgGrad.addColorStop(0.22, '#9a8462');
      bgGrad.addColorStop(0.50, '#4a3d2b');
      bgGrad.addColorStop(0.75, '#bfa378');
      bgGrad.addColorStop(1.0, '#333b48');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 256);

      const strips = [
        { x: 42, w: 28, alpha: 1.0 },
        { x: 155, w: 22, alpha: 0.95 },
        { x: 260, w: 46, alpha: 1.0 },
        { x: 390, w: 26, alpha: 0.95 }
      ];
      strips.forEach((s) => {
        const g = ctx.createLinearGradient(s.x, 0, s.x + s.w, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.5, `rgba(255, 252, 240, ${s.alpha})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(s.x, 8, s.w, 240);
      });

      const equirectTex = new THREE.CanvasTexture(envCanvas);
      equirectTex.mapping = THREE.EquirectangularReflectionMapping;

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      const envRT = pmremGenerator.fromEquirectangular(equirectTex);
      equirectTex.dispose();
      pmremGenerator.dispose();
      return envRT.texture;
    }

    // 產生金屬絲紋粗糙貼圖
    function createBrushedMetalTexture() {
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 256;
      texCanvas.height = 256;
      const ctx = texCanvas.getContext('2d');

      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 256, 256);

      for (let y = 0; y < 256; y++) {
        const shade = Math.floor(90 + Math.random() * 95);
        ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
        ctx.fillRect(0, y, 256, 1);
      }

      const tex = new THREE.CanvasTexture(texCanvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 10);
      return tex;
    }

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const isMobile = window.innerWidth <= 768;
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 1.2, 8.2);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const jewelryEnvMap = buildJewelryStudioEnv(renderer);

    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.8;
    controls.maxDistance = 45.0;
    controls.target.set(0, 0, 0);

    // 燈光設置
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const keyLight = new THREE.DirectionalLight(0xfff8e7, 1.9);
    keyLight.position.set(8, 14, 10);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xdbeafe, 1.2);
    rimLight.position.set(-10, -4, -9);
    scene.add(rimLight);
    const frontFill = new THREE.DirectionalLight(0xffffff, 0.6);
    frontFill.position.set(-4, 5, 12);
    scene.add(frontFill);

    const brushedRoughnessMap = createBrushedMetalTexture();

    // 高級金屬材質 (EL 字母金)
    const goldMat = new THREE.MeshPhysicalMaterial({
      color: 0xd6b06b,
      metalness: 0.92,
      roughness: 0.26,
      roughnessMap: brushedRoughnessMap,
      clearcoat: 0.35,
      clearcoatRoughness: 0.16,
      envMap: jewelryEnvMap,
      envMapIntensity: 1.40
    });

    // 冰河藍金屬材質 (Cubes 方塊銀藍)
    const glacierBlueMat = new THREE.MeshPhysicalMaterial({
      color: 0x6ea6be,
      metalness: 0.68,
      roughness: 0.16,
      clearcoat: 0.90,
      clearcoatRoughness: 0.10,
      envMap: jewelryEnvMap,
      envMapIntensity: 1.35
    });

    // 載入整合好的 EL Cubes.glb
    const loader = new THREE.GLTFLoader();
    loader.load(
      './EL%20Cubes.glb',
      (gltf) => {
        const root = gltf.scene;
        root.updateMatrixWorld(true);

        // 自動置中與縮放
        const box = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        const targetScale = ((isMobile ? 2.0 : 2.3) / (maxDim || 1)) * 0.7;
        root.scale.setScalar(targetScale);
        root.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        scaledBox.getCenter(center);
        root.position.sub(center);
        root.updateMatrixWorld(true);

        // 遍歷所有 Mesh 並精準套用材質
        root.traverse((node) => {
          if (node.isMesh) {
            const origName = (node.material && node.material.name) ? node.material.name : '';
            // 根據模型內部的原始名稱或群組判斷是否為金色 (EL)
            const isGold = origName.includes('0.700') || (node.parent && node.parent.name === 'EL' && !origName.includes('0.820'));

            if (isGold) {
              node.material = goldMat;
            } else {
              node.material = glacierBlueMat;
            }
          }
        });

        modelRoot.add(root);
      },
      undefined,
      (error) => { console.error("EL Cubes Load Error:", error); }
    );

    // 預設視角旋轉
    modelRoot.rotation.set(0.25, -0.65, 0);

    // 動畫循環
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 視窗縮放適應
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
