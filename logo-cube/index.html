<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elements Lab - 3D Logo Cube Assembly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #8fa0b5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
    }

    #metal-frame {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    
    .brand-link {
      text-decoration: none;
      pointer-events: auto;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      transition: color 0.2s ease;
    }

    .brand-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background-color: #0f172a;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
      opacity: 0.6;
    }

    .brand-link:hover .brand-title {
      color: #173654;
    }

    .brand-link:hover .brand-title::after {
      transform: scaleX(1);
      background-color: #173654;
      opacity: 1;
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #475569;
      margin-top: 0.2rem;
    }

    #ui-control-bar {
      position: absolute;
      bottom: 3.8rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
      align-items: center;
      padding: 0.5rem 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(226,232,240,0.7) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 
        0 8px 24px rgba(15, 23, 42, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      z-index: 20;
    }

    .action-btn {
      width: 135px;
      height: 42px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8fafc;
      background: linear-gradient(180deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid #475569;
      border-bottom: 2px solid #020617;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 
        0 3px 8px rgba(15, 23, 42, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.12s ease;
    }
    .action-btn:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 50%, #1e293b 100%);
    }
    .action-btn:active {
      transform: translateY(2px);
      border-bottom: 1px solid #020617;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.3),
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    footer {
      position: absolute;
      bottom: 0.9rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #475569;
      pointer-events: auto;
      z-index: 20;
      line-height: 1.5;
    }

    footer .studio-link {
      color: #334155;
      text-decoration: none;
      position: relative;
      display: inline-block;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    footer .studio-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 1px;
      background-color: #334155;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
      opacity: 0.6;
    }

    footer .studio-link:hover {
      color: #173654;
    }

    footer .studio-link:hover::after {
      transform: scaleX(1);
      background-color: #173654;
      opacity: 1;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="metal-frame"></div>

  <header>
    <div>
      <a href="https://3d.elementslab.net" class="brand-link">
        <div class="brand-title">3D ELEMENTS LAB</div>
      </a>
      <div class="brand-sub">Modular Assembly Simulator</div>
    </div>
  </header>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-control-bar">
    <button class="action-btn" id="btn-flyin">FLY IN</button>
    <button class="action-btn" id="btn-play">PLAY & HIT</button>
  </div>

  <footer>
    <div>© 2026 Elements Lab. All rights reserved.</div>
    <div><a href="https://elementslab.net" class="studio-link">實驗元素工作室</a></div>
  </footer>

  <script>
    const AudioEngine = {
      audioCtx: null,
      init() {
        if (!this.audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.audioCtx = new AudioContext();
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      },
      playSnap() {
        try {
          this.init();
          if (!this.audioCtx) return;
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, this.audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, this.audioCtx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start();
          osc.stop(this.audioCtx.currentTime + 0.12);
        } catch(e) {}
      },
      vibrate(pattern = [15]) {
        try {
          if (typeof navigator !== 'undefined' && navigator.vibrate) {
            navigator.vibrate(pattern);
          }
        } catch(e) {}
      }
    };

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);

    const isMobile = window.innerWidth <= 768;
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 150);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 1.2, 8.2);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3.5;
    controls.maxDistance = 20;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.9));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(10, 15, 10);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x64748b, 1.6);
    fillLight.position.set(-10, 4, -8);
    scene.add(fillLight);

    const champagneGoldMat = new THREE.MeshStandardMaterial({ color: 0xd9b372, metalness: 0.90, roughness: 0.22 });
    const anodizedTealMat = new THREE.MeshStandardMaterial({ color: 0x20486e, metalness: 0.62, roughness: 0.22 });
    const cleanWhiteWireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75 });

    const partRegistry = new Map();
    const activeTweens = [];
    let assembledCount = 15;
    const TOTAL_PARTS = 15;
    const HOME_ROTATION = { x: 0.25, y: -0.65 };

    const trajectoryMap = {
      'E': new THREE.Vector3(0, 45, 15),
      'L': new THREE.Vector3(0, -45, 15),
      'cube01': new THREE.Vector3(-45, 30, 30),
      'cube02': new THREE.Vector3(45, 35, -35),
      'cube03': new THREE.Vector3(-50, -25, -25),
      'cube04': new THREE.Vector3(40, -30, 40),
      'cube05': new THREE.Vector3(-35, 45, -30),
      'cube06': new THREE.Vector3(50, 25, 30),
      'cube07': new THREE.Vector3(-45, -35, 30),
      'cube08': new THREE.Vector3(35, -45, -35),
      'cube09': new THREE.Vector3(-55, 0, 10),
      'cube10': new THREE.Vector3(55, 0, -10),
      'cube11': new THREE.Vector3(0, 10, 50),
      'cube12': new THREE.Vector3(0, -10, -50),
      'cube13': new THREE.Vector3(35, 35, 35)
    };

    const faceRotationMap = {
      'E': { x: 0.25, y: -0.65 },
      'L': { x: 0.25, y: -0.65 },
      'cube01': { x: 0.25, y: -0.85 },
      'cube02': { x: -0.25, y: 2.25 },
      'cube03': { x: 0.35, y: -2.25 },
      'cube04': { x: 0.25, y: 0.9 },
      'cube05': { x: -0.45, y: 0.65 },
      'cube06': { x: 0.45, y: 3.14 },
      'cube07': { x: 0.25, y: -2.85 },
      'cube08': { x: 0.25, y: -1.9 },
      'cube09': { x: 0.25, y: -1.9 },
      'cube10': { x: 0.25, y: 0.9 },
      'cube11': { x: 0.25, y: -0.65 },
      'cube12': { x: 0.25, y: 2.5 },
      'cube13': { x: -0.35, y: 0.35 }
    };

    // --- 載入與除錯防護網 ---
    const loader = new THREE.GLTFLoader();
    loader.load(
      './el-logo asm.glb',
      (gltf) => {
        console.log("SUCCESS: GLB loaded successfully!");
        initAssemblyScene(gltf);
      },
      (xhr) => {
        console.log("LOADING: " + (xhr.loaded / xhr.total * 100) + '% loaded');
      },
      (error) => {
        console.error("ERROR: Failed to load el-logo asm.glb! Check if file exists in same folder.", error);
      }
    );

    function initAssemblyScene(gltf) {
      try {
        const root = gltf.scene;
        console.log("GLB Scene Root:", root);

        const targetPartNames = new Set([
          'E', 'L', 'cube01', 'cube02', 'cube03', 'cube04', 'cube05',
          'cube06', 'cube07', 'cube08', 'cube09', 'cube10', 'cube11', 'cube12', 'cube13'
        ]);

        let foundCount = 0;
        root.traverse((node) => {
          console.log("Found Node in GLB:", node.name);
          if (targetPartNames.has(node.name)) {
            foundCount++;
            const isLogoLetter = (node.name === 'E' || node.name === 'L');
            const solidMat = isLogoLetter ? champagneGoldMat.clone() : anodizedTealMat.clone();

            const meshes = [];
            const wireframes = [];

            node.traverse((child) => {
              if (child.isMesh) {
                child.material = solidMat;
                meshes.push(child);

                const edges = new THREE.EdgesGeometry(child.geometry, 35);
                const wire = new THREE.LineSegments(edges, cleanWhiteWireMat);
                wire.position.copy(child.position);
                wire.rotation.copy(child.rotation);
                wire.scale.copy(child.scale);
                child.parent.add(wire);
                wireframes.push(wire);
              }
            });

            const targetPos = node.position.clone();
            const deepSpaceDir = trajectoryMap[node.name] || new THREE.Vector3(40, 30, 35);
            const hiddenDeepSpacePos = targetPos.clone().add(deepSpaceDir);

            node.position.copy(targetPos);
            node.scale.setScalar(0.85); 
            node.visible = true;
            meshes.forEach(m => m.visible = false);
            wireframes.forEach(w => w.visible = true);

            partRegistry.set(node.name, {
              node: node,
              meshes: meshes,
              wireframes: wireframes,
              targetPos: targetPos,
              deepSpacePos: hiddenDeepSpacePos,
              isAssembled: true
            });
          }
        });

        console.log(`Matched Target Parts: ${foundCount} / 15`);

        root.updateMatrixWorld(true);
        const originalBox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        originalBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        const targetScale = (isMobile ? 2.0 : 2.3) / (maxDim || 1);
        root.scale.setScalar(targetScale);
        root.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        scaledBox.getCenter(center);
        root.position.sub(center);
        root.updateMatrixWorld(true);

        cubeRoot.add(root);
        cubeRoot.rotation.set(HOME_ROTATION.x, HOME_ROTATION.y, 0);
      } catch(err) {
        console.error("Assembly Init Error:", err);
      }
    }

    function resetCameraAndPosition(duration = 320) {
      const startCamPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const startCubePos = cubeRoot.position.clone();
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(startCamPos, DEFAULT_CAM_POS, ease);
          controls.target.lerpVectors(startTarget, new THREE.Vector3(0, 0, 0), ease);
          cubeRoot.position.lerpVectors(startCubePos, new THREE.Vector3(0, 0, 0), ease);
          controls.update();
          return t < 1;
        }
      });
    }

    function smoothRotateCubeTo(targetRot, duration = 280, onComplete = null) {
      const startRotX = cubeRoot.rotation.x;
      const startRotY = cubeRoot.rotation.y;
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          cubeRoot.rotation.x = THREE.MathUtils.lerp(startRotX, targetRot.x, ease);
          cubeRoot.rotation.y = THREE.MathUtils.lerp(startRotY, targetRot.y, ease);
          if (t >= 1 && onComplete) onComplete();
          return t < 1;
        }
      });
    }

    let flyInSequenceCounter = 0;

    function flyInSinglePart(name, isBatch = false, delayMs = 0) {
      const item = partRegistry.get(name);
      if (!item || item.isAssembled) return;

      flyInSequenceCounter++;
      const isPrankDrop = isBatch && (flyInSequenceCounter % 4 === 0);

      setTimeout(() => {
        item.isAssembled = true;
        item.node.visible = true;

        item.meshes.forEach(m => m.visible = true);
        item.wireframes.forEach(w => w.visible = false);

        if (!isBatch && faceRotationMap[name]) {
          smoothRotateCubeTo(faceRotationMap[name], 280);
        }

        const node = item.node;
        const targetPos = item.targetPos.clone();
        const startPos = item.deepSpacePos.clone();
        let actualStartPos = startPos;
        if (isPrankDrop) {
          actualStartPos = targetPos.clone().add(new THREE.Vector3(0, 18, 0));
        }

        const startTime = performance.now();
        const duration = isPrankDrop ? 300 : (isBatch ? 350 : 380);

        activeTweens.push({
          update(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1);
            let ease = isPrankDrop ? (t * t) : (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));
            
            node.position.lerpVectors(actualStartPos, targetPos, ease);
            node.scale.setScalar(THREE.MathUtils.lerp(0.85, 1.0, ease));

            if (t >= 1) {
              node.position.copy(targetPos);
              node.scale.setScalar(1.0);
              assembledCount++;

              if (assembledCount === TOTAL_PARTS) {
                AudioEngine.playSnap();
                AudioEngine.vibrate([25]);
                smoothRotateCubeTo(HOME_ROTATION, 350);
              }
              return false;
            }
            return true;
          }
        });
      }, delayMs);
    }

    const btnFlyIn = document.getElementById('btn-flyin');
    const btnPlay = document.getElementById('btn-play');
    const partOrder = ['E', 'L', 'cube01', 'cube02', 'cube03', 'cube04', 'cube05', 'cube06', 'cube07', 'cube08', 'cube09', 'cube10', 'cube11', 'cube12', 'cube13'];

    btnFlyIn.onclick = () => {
      resetCameraAndPosition();
      clearAllToDeepSpace();
      flyInSequenceCounter = 0;
      smoothRotateCubeTo(HOME_ROTATION, 150);

      partOrder.forEach((name, idx) => {
        flyInSinglePart(name, true, idx * 55);
      });
    };

    let playHitIdx = 0;
    btnPlay.onclick = () => {
      resetCameraAndPosition();

      if (assembledCount >= TOTAL_PARTS) {
        clearAllToDeepSpace();
        playHitIdx = 0;
      }

      while (playHitIdx < partOrder.length) {
        const nextPart = partOrder[playHitIdx++];
        const item = partRegistry.get(nextPart);
        if (item && !item.isAssembled) {
          flyInSinglePart(nextPart, false, 0);
          break;
        }
      }
    };

    function clearAllToDeepSpace() {
      playHitIdx = 0;
      assembledCount = 0;
      partRegistry.forEach((item) => {
        item.isAssembled = false;
        item.node.visible = false;
        item.node.position.copy(item.deepSpacePos);
        item.node.scale.setScalar(0.85);
        item.node.rotation.set(0, 0, 0);
        item.meshes.forEach(m => m.visible = false);
        item.wireframes.forEach(w => w.visible = true);
      });
      cubeRoot.position.set(0, 0, 0);
    }

    let lastActionTime = performance.now();
    let isRoaming = false;
    let roamTime = 0;

    window.addEventListener('pointerdown', () => { 
      lastActionTime = performance.now(); 
      AudioEngine.init();

      if (isRoaming) {
        isRoaming = false;
        const startPos = cubeRoot.position.clone();
        const endPos = new THREE.Vector3(0, 0, 0);
        const startTime = performance.now();
        activeTweens.push({
          update(now) {
            const t = Math.min((now - startTime) / 400, 1);
            cubeRoot.position.lerpVectors(startPos, endPos, 1 - Math.pow(1 - t, 3));
            return t < 1;
          }
        });
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();

      for (let i = activeTweens.length - 1; i >= 0; i--) {
        try {
          if (!activeTweens[i].update(now)) {
            activeTweens.splice(i, 1);
          }
        } catch(e) {
          activeTweens.splice(i, 1);
        }
      }

      controls.update();

      if (now - lastActionTime > 2500) {
        isRoaming = true;
        roamTime += 0.010;
        const ampScale = isMobile ? 1.0 : 0.45;
        cubeRoot.position.x = Math.sin(roamTime * 0.65) * 3.2 * ampScale;
        cubeRoot.position.y = Math.cos(roamTime * 0.45) * 2.2 * ampScale;
        cubeRoot.position.z = Math.sin(roamTime * 0.35) * 1.8 * ampScale - 0.5;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
