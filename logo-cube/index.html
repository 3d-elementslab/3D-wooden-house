  <script>
    // --- 0. 璀璨星空 2D 背景 (大小星點並存) ---
    const starCanvas = document.getElementById('starfield');
    const starCtx = starCanvas.getContext('2d');
    let stars = [];
    let isStarfieldActive = false;

    function resizeStarfield() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.floor((starCanvas.width * starCanvas.height) / 1600);

      for (let i = 0; i < count; i++) {
        const sizeRand = Math.random();
        let size = 0.5 + Math.random() * 0.8;
        let type = 'tiny';
        let color = '#ffffff';

        if (sizeRand > 0.96) {
          size = 1.8 + Math.random() * 1.5;
          type = 'giant';
          color = Math.random() > 0.3 ? '#fffbeb' : '#e0f2fe';
        } else if (sizeRand > 0.85) {
          size = 1.0 + Math.random() * 0.7;
          type = 'medium';
        }

        stars.push({
          x: Math.random() * starCanvas.width,
          y: Math.random() * starCanvas.height,
          size: size,
          type: type,
          color: color,
          alpha: Math.random(),
          speed: 0.005 + Math.random() * 0.015
        });
      }
    }

    function drawStars() {
      if (!isStarfieldActive) return;
      starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.15) s.speed = -s.speed;

        starCtx.save();
        starCtx.globalAlpha = Math.max(0.15, Math.min(s.alpha, 1));
        starCtx.fillStyle = s.color;

        if (s.type === 'giant') {
          const flare = s.size * 2.5;
          const grad = starCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 1.5);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          starCtx.fillStyle = grad;
          starCtx.beginPath();
          starCtx.arc(s.x, s.y, s.size * 1.5, 0, Math.PI * 2);
          starCtx.fill();

          starCtx.strokeStyle = s.color;
          starCtx.lineWidth = 0.6;
          starCtx.beginPath();
          starCtx.moveTo(s.x - flare, s.y);
          starCtx.lineTo(s.x + flare, s.y);
          starCtx.moveTo(s.x, s.y - flare);
          starCtx.lineTo(s.x, s.y + flare);
          starCtx.stroke();
        } else if (s.type === 'medium') {
          starCtx.shadowBlur = 4;
          starCtx.shadowColor = s.color;
          starCtx.beginPath();
          starCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          starCtx.fill();
        } else {
          starCtx.beginPath();
          starCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          starCtx.fill();
        }
        starCtx.restore();
      });

      requestAnimationFrame(drawStars);
    }

    function setStarfieldVisibility(show) {
      isStarfieldActive = show;
      const el = document.getElementById('starfield');
      if (show) {
        el.classList.add('visible');
        drawStars();
      } else {
        el.classList.remove('visible');
      }
    }

    // --- 0. 音效控制與 Web Audio API 精密結尾音 ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playRocketSwoosh() {
      try {
        getAudioContext();
        const audio = document.getElementById('swoosh-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.65;
          audio.play().catch(() => {});
        }
      } catch (e) {}
    }

    function playMetalHit() {
      try {
        const audio = document.getElementById('metal-hit-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.78;
          audio.play().catch(() => {});
        }
      } catch (e) {}
    }

    function playCheeringAudio() {
      try {
        const audio = document.getElementById('cheering-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.85;
          audio.play().catch(() => {});
        }
      } catch (e) {}
    }

    function playFlyInLockChord() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const bufferSize = Math.floor(ctx.sampleRate * 0.045);
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.22));
        }
        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = noiseBuffer;

        const bandpass = ctx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.setValueAtTime(2400, now);
        bandpass.Q.setValueAtTime(3.2, now);

        const clickGain = ctx.createGain();
        clickGain.gain.setValueAtTime(0.35, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

        noiseSource.connect(bandpass);
        bandpass.connect(clickGain);
        clickGain.connect(ctx.destination);
        noiseSource.start(now);

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(76, now);
        subOsc.frequency.exponentialRampToValueAtTime(52, now + 0.35);

        subGain.gain.setValueAtTime(0.001, now);
        subGain.gain.linearRampToValueAtTime(0.32, now + 0.015);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);

        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start(now);
        subOsc.stop(now + 0.45);

        const chordFreqs = [587.33, 880.0, 1318.51];
        chordFreqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const startT = now + 0.04 + idx * 0.035;
          osc.frequency.setValueAtTime(freq, startT);

          gain.gain.setValueAtTime(0.0001, startT);
          gain.gain.linearRampToValueAtTime(0.055 - idx * 0.01, startT + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, startT + 1.15);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startT);
          osc.stop(startT + 1.2);
        });
      } catch (e) {}
    }

    // --- 1. 360° 全包覆「柔光帳篷」PMREM 攝影棚反射圖 ---
    function buildStudioPMREM(renderer) {
      const envCanvas = document.createElement('canvas');
      envCanvas.width = 512;
      envCanvas.height = 256;
      const ctx = envCanvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, 256);
      bgGrad.addColorStop(0.0, '#fffbeb');
      bgGrad.addColorStop(0.3, '#f7f1e1');
      bgGrad.addColorStop(0.6, '#eae1cd');
      bgGrad.addColorStop(1.0, '#f2e6d0');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 256);

      const strips = [
        { x: 30, w: 45, alpha: 0.98 },
        { x: 135, w: 35, alpha: 0.92 },
        { x: 245, w: 75, alpha: 1.0 },
        { x: 380, w: 48, alpha: 0.95 },
        { x: 470, w: 30, alpha: 0.90 }
      ];
      strips.forEach((s) => {
        const g = ctx.createLinearGradient(s.x, 0, s.x + s.w, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.5, `rgba
