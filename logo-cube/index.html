<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elements Lab - 3D Logo Cube Assembly (Master Edition)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #8fa0b5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
    }

    #metal-frame {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    
    .brand-link {
      text-decoration: none;
      pointer-events: auto;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      transition: color 0.25s ease;
    }

    .brand-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background-color: #0f172a;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease;
      opacity: 0.6;
    }

    /* 青黃金色號 #c8c074 */
    .brand-link:hover .brand-title,
    .brand-link.celebrate-gold .brand-title {
      color: #c8c074;
    }

    .brand-link:hover .brand-title::after,
    .brand-link.celebrate-gold .brand-title::after {
      transform: scaleX(1);
      background-color: #c8c074;
      opacity: 1;
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #475569;
      margin-top: 0.2rem;
    }

    #ui-control-bar {
      position: absolute;
      bottom: 3.8rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
      align-items: center;
      padding: 0.5rem 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(226,232,240,0.7) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 
        0 8px 24px rgba(15, 23, 42, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      z-index: 20;
    }

    .action-btn {
      width: 135px;
      height: 42px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8fafc;
      background: linear-gradient(180deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid #475569;
      border-bottom: 2px solid #020617;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 
        0 3px 8px rgba(15, 23, 42, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 50%, #1e293b 100%);
      color: #c8c074;
    }
    .action-btn:active {
      transform: translateY(2px);
      border-bottom: 1px solid #020617;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.3),
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    /* 通關 5 秒定格期間按鈕狀態：發光鎖定防止誤觸重置 */
    .action-btn.victory-locked {
      color: #c8c074;
      border-color: #c8c074;
      box-shadow: 0 0 16px rgba(200, 192, 116, 0.55);
      cursor: default;
      pointer-events: none;
    }

    /* SVG 預覽開場層 */
    #svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #svg-overlay img {
      width: 36vw;
      max-width: 360px;
      height: auto;
      transform: translateX(-32px);
      filter: drop-shadow(0 12px 24px rgba(15, 23, 42, 0.15));
    }

    footer {
      position: absolute;
      bottom: 0.9rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #475569;
      pointer-events: auto;
      z-index: 20;
      line-height: 1.5;
    }

    footer .studio-link {
      color: #334155;
      text-decoration: none;
      position: relative;
      display: inline-block;
      font-weight: 500;
      transition: color 0.25s ease;
    }

    footer .studio-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 1px;
      background-color: #334155;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease;
      opacity: 0.6;
    }

    .brand-link:hover .brand-title,
    .brand-link.celebrate-gold .brand-title,
    footer .studio-link:hover,
    footer .studio-link.celebrate-gold {
      color: #c8c074;
    }

    footer .studio-link:hover::after,
    footer .studio-link.celebrate-gold::after {
      transform: scaleX(1);
      background-color: #c8c074;
      opacity: 1;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="metal-frame"></div>

  <div id="svg-overlay">
    <img src="./logo-wire.svg" alt="Logo Wireframe">
  </div>

  <header>
    <div>
      <a href="https://3d.elementslab.net" class="brand-link" id="brand-link">
        <div class="brand-title">3D ELEMENTS LAB</div>
      </a>
      <div class="brand-sub">Modular Assembly Simulator</div>
    </div>
  </header>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-control-bar">
    <button class="action-btn" id="btn-flyin">FLY IN</button>
    <button class="action-btn" id="btn-play">PLAY & HIT</button>
  </div>

  <footer>
    <div>© 2026 Elements Lab. All rights reserved.</div>
    <div><a href="https://elementslab.net" class="studio-link" id="studio-link">實驗元素工作室</a></div>
  </footer>

  <audio id="swoosh-audio" src="./rocket-woosh.wav" preload="auto"></audio>
  <audio id="metal-hit-audio" src="./metal-hit.wav" preload="auto"></audio>
  <audio id="cheering-audio" src="./cheering.wav" preload="auto"></audio>

  <script>
    // --- 0. 音效控制 ---
    function playRocketSwoosh() {
      try {
        const audio = document.getElementById('swoosh-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.7;
          audio.play().catch(e => {});
        }
      } catch (e) {}
    }

    function playMetalHit() {
      try {
        const audio = document.getElementById('metal-hit-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.78;
          audio.play().catch(e => {});
        }
      } catch (e) {}
    }

    function playCheeringAudio() {
      try {
        const audio = document.getElementById('cheering-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.85;
          audio.play().catch(e => {});
        }
      } catch (e) {}
    }

    function triggerGoldTextHighlight(active) {
      const brandLink = document.getElementById('brand-link');
      const studioLink = document.getElementById('studio-link');
      if (brandLink) brandLink.classList.toggle('celebrate-gold', active);
      if (studioLink) studioLink.classList.toggle('celebrate-gold', active);
    }

    // --- 1. Three.js 場景建構 ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);

    const isMobile = window.innerWidth <= 768;
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 200);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 1.2, 8.2);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.8;  
    controls.maxDistance = 45.0; 
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 1.9));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(10, 15, 10);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x64748b, 1.6);
    fillLight.position.set(-10, 4, -8);
    scene.add(fillLight);
    const bottomBounce = new THREE.DirectionalLight(0xcbd5e1, 1.1);
    bottomBounce.position.set(0, -8, 0);
    scene.add(bottomBounce);

    // --- 2. 高級金屬材質（支援通關暖金自發光動畫） ---
    const champagneGoldMat = new THREE.MeshStandardMaterial({
      color: 0xebd2a0,
      metalness: 0.85,
      roughness: 0.22,
      emissive: 0x000000,
      emissiveIntensity: 0
    });

    const anodizedTealMat = new THREE.MeshStandardMaterial({
      color: 0x4a729c,
      metalness: 0.65,
      roughness: 0.25,
      emissive: 0x000000,
      emissiveIntensity: 0
    });

    const partRegistry = new Map();
    const activeTweens = [];
    let assembledCount = 0;
    const TOTAL_PARTS = 15;
    const HOME_ROTATION = { x: 0.25, y: -0.65 };
    let isAssemblyActive = false;
    let isVictoryLocked = false; // ★ 通關 5 秒防誤觸鎖定旗標
    let victoryLockTimer = null;

    // Fly-In 用的深空軌跡
    const trajectoryMap = {
      'E': new THREE.Vector3(0, 260, 110),
      'L': new THREE.Vector3(0, -260, 110),
      'cube01': new THREE.Vector3(0, 320, 0),
      'cube02': new THREE.Vector3(260, 200, -200),
      'cube03': new THREE.Vector3(-280, -160, -160),
      'cube04': new THREE.Vector3(240, -180, 240),
      'cube05': new THREE.Vector3(-230, 270, -200),
      'cube06': new THREE.Vector3(270, 160, 200),
      'cube07': new THREE.Vector3(-260, -210, 200),
      'cube08': new THREE.Vector3(230, -260, -230),
      'cube09': new THREE.Vector3(-320, 0, 80),
      'cube10': new THREE.Vector3(320, 0, -80),
      'cube11': new THREE.Vector3(0, 80, 320),
      'cube12': new THREE.Vector3(0, -80, -320),
      'cube13': new THREE.Vector3(230, 230, 230)
    };

    // 刺激大角度視角跳轉
    const faceRotationMap = {
      'E': { x: 0.25, y: -0.65 },
      'L': { x: 0.35, y: -0.45 },
      'cube01': { x: 0.45, y: -1.35 },
      'cube02': { x: -0.55, y: 2.55 },
      'cube03': { x: 0.65, y: -2.60 },
      'cube04': { x: 0.40, y: 1.35 },
      'cube05': { x: -0.75, y: 0.95 },
      'cube06': { x: 0.70, y: 3.60 },
      'cube07': { x: 0.35, y: -3.25 },
      'cube08': { x: 0.55, y: -2.20 },
      'cube09': { x: -0.45, y: -1.40 },
      'cube10': { x: 0.50, y: 1.45 },
      'cube11': { x: -0.35, y: -0.95 },
      'cube12': { x: 0.55, y: 2.85 },
      'cube13': { x: -0.60, y: 0.65 }
    };

    // --- 3. 載入模型 + * 0.7 比例精準置中校正 ---
    const loader = new THREE.GLTFLoader();
    loader.load(
      './el-logo asm.glb',
      (gltf) => { initAssemblyScene(gltf); },
      undefined,
      (error) => { console.error("GLB Load Error:", error); }
    );

    function initAssemblyScene(gltf) {
      try {
        const root = gltf.scene;
        const targetPartNames = new Set([
          'E', 'L', 'cube01', 'cube02', 'cube03', 'cube04', 'cube05',
          'cube06', 'cube07', 'cube08', 'cube09', 'cube10', 'cube11', 'cube12', 'cube13'
        ]);

        root.updateMatrixWorld(true);
        const assemblyBox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        assemblyBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        // * 0.7 比例倍率
        const targetScale = ((isMobile ? 2.0 : 2.3) / (maxDim || 1)) * 0.7;
        root.scale.setScalar(targetScale);
        root.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        scaledBox.getCenter(center);
        root.position.sub(center);
        root.updateMatrixWorld(true);

        root.traverse((node) => {
          if (targetPartNames.has(node.name)) {
            const isLogoLetter = (node.name === 'E' || node.name === 'L');
            const solidMat = isLogoLetter ? champagneGoldMat.clone() : anodizedTealMat.clone();

            const meshes = [];
            node.traverse((child) => {
              if (child.isMesh) {
                child.material = solidMat;
                meshes.push(child);
              }
            });

            const targetPos = node.position.clone();
            const deepSpaceDir = trajectoryMap[node.name] || new THREE.Vector3(60, 50, 55);
            const hiddenDeepSpacePos = targetPos.clone().add(deepSpaceDir);

            node.position.copy(hiddenDeepSpacePos);
            node.scale.setScalar(0.85);
            node.visible = false;
            meshes.forEach(m => m.visible = false);

            partRegistry.set(node.name, {
              node: node,
              meshes: meshes,
              isLogoLetter: isLogoLetter,
              targetPos: targetPos,
              deepSpacePos: hiddenDeepSpacePos,
              isAssembled: false
            });
          }
        });

        cubeRoot.add(root);
        cubeRoot.position.set(0, 0, 0);
        cubeRoot.rotation.set(HOME_ROTATION.x, HOME_ROTATION.y, 0);
      } catch(err) {
        console.error("Assembly Init Error:", err);
      }
    }

    function resetCameraAndPosition(duration = 320) {
      const startCamPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const startCubePos = cubeRoot.position.clone();
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(startCamPos, DEFAULT_CAM_POS, ease);
          controls.target.lerpVectors(startTarget, new THREE.Vector3(0, 0, 0), ease);
          cubeRoot.position.lerpVectors(startCubePos, new THREE.Vector3(0, 0, 0), ease);
          controls.update();
          return t < 1;
        }
      });
    }

    function smoothRotateCubeTo(targetRot, duration = 450, onComplete = null) {
      const startRotX = cubeRoot.rotation.x;
      const startRotY = cubeRoot.rotation.y;
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          cubeRoot.rotation.x = THREE.MathUtils.lerp(startRotX, targetRot.x, ease);
          cubeRoot.rotation.y = THREE.MathUtils.lerp(startRotY, targetRot.y, ease);
          if (t >= 1 && onComplete) onComplete();
          return t < 1;
        }
      });
    }

    function hideSvgOverlay() {
      const overlay = document.getElementById('svg-overlay');
      if (overlay && overlay.style.opacity !== '0') {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 500);
      }
    }

    // =========================================================
    // ★ 通關高潮演出：整體暖金發光 + 彈跳呼吸 + 鎖定 5 秒聽完 cheering.wav
    // =========================================================
    function triggerVictoryCelebration() {
      isVictoryLocked = true;
      isAssemblyActive = true;
      lastActionTime = performance.now();

      // 1) 按鈕鎖定 5 秒防止慣性誤觸重置，並顯示 COMPLETED!
      const btnPlay = document.getElementById('btn-play');
      if (btnPlay) {
        btnPlay.classList.add('victory-locked');
        btnPlay.textContent = 'COMPLETED!';
      }

      // 2) 文字亮起青黃金 #c8c074 並播放 cheering.wav
      triggerGoldTextHighlight(true);
      playCheeringAudio();

      // 3) 整個立方體平順轉回正面展示角度
      smoothRotateCubeTo(HOME_ROTATION, 520);

      // 4) 整體彈跳脈衝 + 暖金色金屬微光呼吸動畫（持續 5 秒）
      const startTime = performance.now();
      const celebrationDuration = 5000;

      activeTweens.push({
        update(now) {
          const elapsed = now - startTime;
          const t = Math.min(elapsed / celebrationDuration, 1);

          // 前 0.6 秒有一個立體彈跳放大回饋（1.0 -> 1.09 -> 1.0）
          if (t < 0.14) {
            const popT = t / 0.14;
            const scaleBoost = 1 + Math.sin(popT * Math.PI) * 0.09;
            cubeRoot.scale.setScalar(scaleBoost);
          } else {
            cubeRoot.scale.setScalar(1.0);
          }

          // 暖金金屬光暈呼吸曲線（前段快速點亮，接著溫和呼吸脈動，5秒結束時優雅淡出）
          const envelope = t < 0.1 ? (t / 0.1) : (t > 0.8 ? (1 - t) / 0.2 : 1.0);
          const pulse = 0.65 + 0.35 * Math.sin(elapsed * 0.006);
          const glowPower = envelope * pulse;

          partRegistry.forEach((item) => {
            item.meshes.forEach((m) => {
              if (item.isLogoLetter) {
                m.material.emissive.setHex(0xd4af37); // 香檳暖金光暈
                m.material.emissiveIntensity = glowPower * 0.55;
              } else {
                m.material.emissive.setHex(0x64b5f6); // 科技冰藍金邊光暈
                m.material.emissiveIntensity = glowPower * 0.38;
              }
            });
          });

          if (t >= 1) {
            // 恢復正常金屬光澤
            partRegistry.forEach((item) => {
              item.meshes.forEach((m) => {
                m.material.emissive.setHex(0x000000);
                m.material.emissiveIntensity = 0;
              });
            });
            cubeRoot.scale.setScalar(1.0);
            isAssemblyActive = false;
            lastActionTime = performance.now();
            return false;
          }
          return true;
        }
      });

      // 5 秒後解除按鈕鎖定，可再次點擊進行新一輪
      if (victoryLockTimer) clearTimeout(victoryLockTimer);
      victoryLockTimer = setTimeout(() => {
        isVictoryLocked = false;
        if (btnPlay) {
          btnPlay.classList.remove('victory-locked');
          btnPlay.textContent = 'PLAY & HIT';
        }
      }, celebrationDuration);
    }

    // =========================================================
    // ★ 模式 A：FLY IN（乾淨 15 顆精密組裝，移除掉落彩蛋與合成結尾音）
    // =========================================================
    function triggerFullFlyIn() {
      // 若正在 5 秒通關慶祝中按 FLY IN，直接解除鎖定切換過去
      if (victoryLockTimer) clearTimeout(victoryLockTimer);
      isVictoryLocked = false;
      const btnPlay = document.getElementById('btn-play');
      if (btnPlay) {
        btnPlay.classList.remove('victory-locked');
        btnPlay.textContent = 'PLAY & HIT';
      }

      resetCameraAndPosition();
      clearAllToDeepSpace();
      hideSvgOverlay();
      triggerGoldTextHighlight(false);

      isAssemblyActive = true;
      lastActionTime = performance.now();
      smoothRotateCubeTo(HOME_ROTATION, 400);

      playRocketSwoosh();

      const totalFlyDuration = 3800;

      partOrder.forEach((name, idx) => {
        const item = partRegistry.get(name);
        if (!item) return;

        item.isAssembled = true;
        item.node.visible = true;
        item.meshes.forEach(m => m.visible = true);

        const node = item.node;
        const targetPos = item.targetPos.clone();
        const startPos = item.deepSpacePos.clone();

        const staggerDelay = idx * 28;
        const partDuration = totalFlyDuration - staggerDelay;
        const startTime = performance.now() + staggerDelay;

        const spinStart = new THREE.Euler(
          (Math.random() - 0.5) * Math.PI * 2.5,
          (Math.random() - 0.5) * Math.PI * 2.5,
          (Math.random() - 0.5) * Math.PI * 2.5
        );

        activeTweens.push({
          update(now) {
            if (now < startTime) return true;

            const elapsed = now - startTime;
            const t = Math.min(elapsed / partDuration, 1);
            const ease = 1 - Math.pow(1 - t, 5.2);

            node.position.lerpVectors(startPos, targetPos, ease);
            node.scale.setScalar(THREE.MathUtils.lerp(0.82, 1.0, ease));
            node.rotation.set(
              THREE.MathUtils.lerp(spinStart.x, 0, ease),
              THREE.MathUtils.lerp(spinStart.y, 0, ease),
              THREE.MathUtils.lerp(spinStart.z, 0, ease)
            );

            if (t >= 1) {
              node.position.copy(targetPos);
              node.scale.setScalar(1.0);
              node.rotation.set(0, 0, 0);
              assembledCount++;
              checkAllFlyInFinished();
              return false;
            }
            return true;
          }
        });
      });
    }

    function checkAllFlyInFinished() {
      if (assembledCount >= TOTAL_PARTS) {
        triggerGoldTextHighlight(true);
        setTimeout(() => triggerGoldTextHighlight(false), 2600);
        smoothRotateCubeTo(HOME_ROTATION, 350, () => {
          isAssemblyActive = false;
          lastActionTime = performance.now();
        });
      }
    }

    // =========================================================
    // ★ 模式 B：PLAY & HIT（零穿透外側飛入 + 大角度跳轉 + metal-hit.wav + 5秒通關高潮）
    // =========================================================
    function playHitSinglePart(name) {
      const item = partRegistry.get(name);
      if (!item || item.isAssembled) return;

      hideSvgOverlay();
      isAssemblyActive = true;
      lastActionTime = performance.now();

      item.isAssembled = true;
      item.node.visible = true;
      item.meshes.forEach(m => m.visible = true);

      playMetalHit();

      const targetRot = faceRotationMap[name] || HOME_ROTATION;
      smoothRotateCubeTo(targetRot, 480);

      const node = item.node;
      const targetPos = item.targetPos.clone();

      const targetEuler = new THREE.Euler(targetRot.x, targetRot.y, 0);
      const targetQuat = new THREE.Quaternion().setFromEuler(targetEuler);
      const invQuat = targetQuat.clone().invert();

      const outwardDir = targetPos.clone();
      if (outwardDir.lengthSq() < 0.001) {
        outwardDir.set(0, 0.2, 1);
      }
      outwardDir.normalize();

      const cameraFrontLocal = new THREE.Vector3(0, 0.25, 1).applyQuaternion(invQuat).normalize();
      const nonPenetratingDir = outwardDir.multiplyScalar(0.65).addScaledVector(cameraFrontLocal, 0.35).normalize();
      const startPos = targetPos.clone().addScaledVector(nonPenetratingDir, 38);
      const arcOffset = nonPenetratingDir.clone().multiplyScalar(3.2);

      const startRot = new THREE.Euler(
        (Math.random() > 0.5 ? 1 : -1) * Math.PI * 0.5,
        (Math.random() > 0.5 ? 1 : -1) * Math.PI,
        0
      );

      node.position.copy(startPos);
      const startTime = performance.now();
      const duration = 950;

      activeTweens.push({
        update(now) {
          const elapsed = now - startTime;
          const t = Math.min(elapsed / duration, 1);
          const ease = t === 1 ? 1 : 1 - Math.pow(2, -9 * t);

          node.position.lerpVectors(startPos, targetPos, ease);
          const arcFactor = Math.sin(Math.PI * t) * (1 - ease);
          node.position.addScaledVector(arcOffset, arcFactor);

          node.scale.setScalar(THREE.MathUtils.lerp(0.8, 1.0, ease));
          node.rotation.set(
            THREE.MathUtils.lerp(startRot.x, 0, ease),
            THREE.MathUtils.lerp(startRot.y, 0, ease),
            THREE.MathUtils.lerp(startRot.z, 0, ease)
          );

          if (t >= 1) {
            node.position.copy(targetPos);
            node.scale.setScalar(1.0);
            node.rotation.set(0, 0, 0);
            assembledCount++;

            // ★ 敲滿 15 顆！啟動整體發光＋5秒定格保護聽完 cheering.wav
            if (assembledCount === TOTAL_PARTS) {
              triggerVictoryCelebration();
            } else {
              setTimeout(() => {
                if (assembledCount < TOTAL_PARTS) {
                  isAssemblyActive = false;
                }
              }, 1200);
            }
            return false;
          }
          return true;
        }
      });
    }

    const btnFlyIn = document.getElementById('btn-flyin');
    const btnPlay = document.getElementById('btn-play');
    const partOrder = ['E', 'L', 'cube01', 'cube02', 'cube03', 'cube04', 'cube05', 'cube06', 'cube07', 'cube08', 'cube09', 'cube10', 'cube11', 'cube12', 'cube13'];

    btnFlyIn.onclick = () => {
      triggerFullFlyIn();
    };

    let playHitIdx = 0;
    btnPlay.onclick = () => {
      // ★ 若正在 5 秒通關慶祝中，忽略任何慣性連點，確保完整欣賞發光與 cheering.wav
      if (isVictoryLocked) return;

      resetCameraAndPosition();

      if (assembledCount >= TOTAL_PARTS) {
        clearAllToDeepSpace();
        triggerGoldTextHighlight(false);
        playHitIdx = 0;
      }

      while (playHitIdx < partOrder.length) {
        const nextPart = partOrder[playHitIdx++];
        const item = partRegistry.get(nextPart);
        if (item && !item.isAssembled) {
          playHitSinglePart(nextPart);
          break;
        }
      }
    };

    function clearAllToDeepSpace() {
      playHitIdx = 0;
      assembledCount = 0;
      isAssemblyActive = false;
      isRoaming = false;
      roamTime = 0;
      roamSpeedFactor = 0;
      cubeRoot.scale.setScalar(1.0);
      
      const overlay = document.getElementById('svg-overlay');
      if (overlay) {
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
      }

      partRegistry.forEach((item) => {
        item.isAssembled = false;
        item.node.visible = false;
        item.node.position.copy(item.deepSpacePos);
        item.node.scale.setScalar(0.85);
        item.node.rotation.set(0, 0, 0);
        item.meshes.forEach(m => {
          m.visible = true;
          m.material.emissive.setHex(0x000000);
          m.material.emissiveIntensity = 0;
        });
      });
      cubeRoot.position.set(0, 0, 0);
    }

    // =========================================================
    // ★ 漫遊控制（靜止 3.8 秒後從速度 0 平滑啟動）
    // =========================================================
    let lastActionTime = performance.now();
    let isRoaming = false;
    let roamTime = 0;
    let roamSpeedFactor = 0;

    window.addEventListener('pointerdown', () => { 
      lastActionTime = performance.now(); 

      if (isRoaming) {
        isRoaming = false;
        roamSpeedFactor = 0;
        const startPos = cubeRoot.position.clone();
        const endPos = new THREE.Vector3(0, 0, 0);
        const startTime = performance.now();
        activeTweens.push({
          update(now) {
            const t = Math.min((now - startTime) / 400, 1);
            cubeRoot.position.lerpVectors(startPos, endPos, 1 - Math.pow(1 - t, 3));
            return t < 1;
          }
        });
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();

      for (let i = activeTweens.length - 1; i >= 0; i--) {
        try {
          if (!activeTweens[i].update(now)) {
            activeTweens.splice(i, 1);
          }
        } catch(e) {
          activeTweens.splice(i, 1);
        }
      }

      controls.update();

      if (!isAssemblyActive && now - lastActionTime > 3800) {
        if (!isRoaming) {
          isRoaming = true;
          roamTime = 0;
          roamSpeedFactor = 0;
        }
        roamSpeedFactor = Math.min(roamSpeedFactor + 0.011, 1);
        const smoothEase = roamSpeedFactor * roamSpeedFactor * (3 - 2 * roamSpeedFactor);

        roamTime += 0.010 * smoothEase;
        const ampScale = (isMobile ? 1.0 : 0.45) * smoothEase;

        cubeRoot.position.x = Math.sin(roamTime * 0.65) * 3.2 * ampScale;
        cubeRoot.position.y = Math.sin(roamTime * 0.45) * 2.0 * ampScale;
        cubeRoot.position.z = Math.sin(roamTime * 0.35) * 1.6 * ampScale;
        cubeRoot.rotation.y += 0.0035 * smoothEase;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
