<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elements Lab - 3D Logo Cube Assembly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #8fa0b5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
    }

    #metal-frame {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    
    .brand-link {
      text-decoration: none;
      pointer-events: auto;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      transition: color 0.2s ease;
    }

    /* 細緻的動態底線暗示超連結 */
    .brand-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background-color: #0f172a;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
      opacity: 0.6;
    }

    .brand-link:hover .brand-title {
      color: #173654;
    }

    .brand-link:hover .brand-title::after {
      transform: scaleX(1);
      background-color: #173654;
      opacity: 1;
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #475569;
      margin-top: 0.2rem;
    }

    #ui-control-bar {
      position: absolute;
      bottom: 3.8rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
      align-items: center;
      padding: 0.5rem 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(226,232,240,0.7) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 
        0 8px 24px rgba(15, 23, 42, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      z-index: 20;
    }

    .action-btn {
      width: 135px;
      height: 42px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8fafc;
      background: linear-gradient(180deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid #475569;
      border-bottom: 2px solid #020617;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 
        0 3px 8px rgba(15, 23, 42, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.12s ease;
    }
    .action-btn:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 50%, #1e293b 100%);
    }
    .action-btn:active {
      transform: translateY(2px);
      border-bottom: 1px solid #020617;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.3),
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    footer {
      position: absolute;
      bottom: 0.9rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #475569;
      pointer-events: auto;
      z-index: 20;
      line-height: 1.5;
    }

    footer .studio-link {
      color: #334155;
      text-decoration: none;
      position: relative;
      display: inline-block;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    footer .studio-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 1px;
      background-color: #334155;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease;
      opacity: 0.6;
    }

    footer .studio-link:hover {
      color: #173654;
    }

    footer .studio-link:hover::after {
      transform: scaleX(1);
      background-color: #173654;
      opacity: 1;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="metal-frame"></div>

  <header>
    <div>
      <a href="https://3d.elementslab.net" class="brand-link">
        <div class="brand-title">3D ELEMENTS LAB</div>
      </a>
      <div class="brand-sub">Modular Assembly Simulator</div>
    </div>
  </header>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-control-bar">
    <button class="action-btn" id="btn-flyin">FLY IN</button>
    <button class="action-btn" id="btn-play">PLAY & HIT</button>
  </div>

  <footer>
    <div>© 2026 Elements Lab. All rights reserved.</div>
    <div><a href="https://elementslab.net" class="studio-link">實驗元素工作室</a></div>
  </footer>

  <script>
    // --- 1. 音效引擎（換回乾淨的單一結尾音效） ---
    const AudioEngine = {
      audioCtx: null,
      init() {
        if (!this.audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.audioCtx = new AudioContext();
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {
          this.audioCtx.resume();
        }
      },
      playSnap() {
        try {
          this.init();
          if (!this.audioCtx) return;
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, this.audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, this.audioCtx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start();
          osc.stop(this.audioCtx.currentTime + 0.12);
        } catch(e) {}
      },
      vibrate(pattern = [15]) {
        try {
          if (typeof navigator !== 'undefined' && navigator.vibrate) {
            navigator.vibrate(pattern);
          }
        } catch(e) {}
      }
    };

    // --- 2. Three.js 場景建構 ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);

    const isMobile = window.innerWidth <= 768;
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 150);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 1.2, 8.2);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ 
      canvas, 
      antialias: true, 
      alpha: true, 
      powerPreference: "high-performance" 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3.5;
    controls.maxDistance = 20;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.9);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(10, 15, 10);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x64748b, 1.6);
    fillLight.position.set(-10, 4, -8);
    scene.add(fillLight);

    const bottomBounce = new THREE.DirectionalLight(0xcbd5e1, 1.1);
    bottomBounce.position.set(0, -8, 0);
    scene.add(bottomBounce);

    // --- 3. 材質配置（香檳金維持，青藍色比先前 +8% 再扣掉 5% = 淨調亮 3%） ---
    const champagneGoldMat = new THREE.MeshStandardMaterial({
      color: 0xd9b372,
      metalness: 0.90,
      roughness: 0.22,
    });

    const anodizedTealMat = new THREE.MeshStandardMaterial({
      color: 0x20486e, // 完美平衡的優雅陽極青藍色
      metalness: 0.62,
      roughness: 0.22,
    });

    // 提高邊緣角度閥值 (35度)，過濾掉多餘雜訊線條，解決細框破碎問題
    const cleanWhiteWireMat = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.75,
      linewidth: 1
    });

    // --- 4. 零件定向路徑與旋轉基準 ---
    const partRegistry = new Map();
    const activeTweens = [];
    let assembledCount = 15;
    const TOTAL_PARTS = 15;

    // 校正 E 朝下與 XYZ 方位的預設鏡頭旋轉基準
    const HOME_ROTATION = { x: 0.25, y: -0.65 };

    const trajectoryMap = {
      'E': new THREE.Vector3(0, 45, 15),
      'L': new THREE.Vector3(0, -45, 15),
      'cube01': new THREE.Vector3(-45, 30, 30),
      'cube02': new THREE.Vector3(45, 35, -35),
      'cube03': new THREE.Vector3(-50, -25, -25),
      'cube04': new THREE.Vector3(40, -30, 40),
      'cube05': new THREE.Vector3(-35, 45, -30),
      'cube06': new THREE.Vector3(50, 25, 30),
      'cube07': new THREE.Vector3(-45, -35, 30),
      'cube08': new THREE.Vector3(35, -45, -35),
      'cube09': new THREE.Vector3(-55, 0, 10),
      'cube10': new THREE.Vector3(55, 0, -10),
      'cube11': new THREE.Vector3(0, 10, 50),
      'cube12': new THREE.Vector3(0, -10, -50),
      'cube13': new THREE.Vector3(35, 35, 35)
    };

    const faceRotationMap = {
      'E': { x: 0.25, y: -0.65 },
      'L': { x: 0.25, y: -0.65 },
      'cube01': { x: 0.25, y: -0.85 },
      'cube02': { x: -0.25, y: 2.25 },
      'cube03': { x: 0.35, y: -2.25 },
      'cube04': { x: 0.25, y: 0.9 },
      'cube05': { x: -0.45, y: 0.65 },
      'cube06': { x: 0.45, y: 3.14 },
      'cube07': { x: 0.25, y: -2.85 },
      'cube08': { x: 0.25, y: -1.9 },
      'cube09': { x: 0.25, y: -1.9 },
      'cube10': { x: 0.25, y: 0.9 },
      'cube11': { x: 0.25, y: -0.65 },
      'cube12': { x: 0.25, y: 2.5 },
      'cube13': { x: -0.35, y: 0.35 }
    };

    // --- 5. 載入模型 ---
    const loader = new THREE.GLTFLoader();
    loader.load(
      './el-logo%20asm.glb',
      (gltf) => { initAssemblyScene(gltf); },
      undefined,
      () => {
        loader.load('./el-logo asm.glb', (gltf) => initAssemblyScene(gltf));
      }
    );

    function initAssemblyScene(gltf) {
      try {
        const root = gltf.scene;
        root.traverse((node) => { node.matrixAutoUpdate = true; });

        root.updateMatrixWorld(true);
        const originalBox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        originalBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        const targetScale = (isMobile ? 2.0 : 2.3) / (maxDim || 1);
        root.scale.setScalar(targetScale);
        root.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        scaledBox.getCenter(center);
        root.position.sub(center);
        root.updateMatrixWorld(true);

        cubeRoot.add(root);

        const targetPartNames = new Set([
          'E', 'L', 'cube01', 'cube02', 'cube03', 'cube04', 'cube05',
          'cube06', 'cube07', 'cube08', 'cube09', 'cube10', 'cube11', 'cube12', 'cube13'
        ]);

        root.traverse((node) => {
          if (targetPartNames.has(node.name)) {
            const isLogoLetter = (node.name === 'E' || node.name === 'L');
            const solidMat = isLogoLetter ? champagneGoldMat.clone() : anodizedTealMat.clone();

            const meshes = [];
            const wireframes = [];

            node.traverse((child) => {
              if (child.isMesh) {
                child.material = solidMat;
                meshes.push(child);

                // 使用 35 度閥值過濾共面雜訊，讓細框俐落不破碎
                const edges = new THREE.EdgesGeometry(child.geometry, 35);
                const wire = new THREE.LineSegments(edges, cleanWhiteWireMat);
                wire.position.copy(child.position);
                wire.rotation.copy(child.rotation);
                wire.scale.copy(child.scale);
                child.parent.add(wire);
                wireframes.push(wire);
              }
            });

            const targetPos = node.position.clone();
            const deepSpaceDir = trajectoryMap[node.name] || new THREE.Vector3(40, 30, 35);
            const hiddenDeepSpacePos = targetPos.clone().add(deepSpaceDir);

            node.position.copy(targetPos);
            node.scale.setScalar(0
