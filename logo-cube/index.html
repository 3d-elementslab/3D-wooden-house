<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>Elements Lab - 3D Logo Cube Assembly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #8fa0b5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
      transition: background 1.5s cubic-bezier(0.25, 1, 0.5, 1), color 1s ease;
    }

    body.night-mode {
      background: radial-gradient(circle at 50% 30%, #0f1c33 0%, #070d1a 60%, #02050a 100%);
      color: #f1f5f9;
    }

    #starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    #starfield.visible {
      opacity: 1;
    }

    #metal-frame {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
      transition: box-shadow 1s ease;
    }
    body.night-mode #metal-frame {
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.22),
        inset 0 0 0 2px rgba(51, 65, 85, 0.5),
        inset 0 0 0 3px rgba(255, 255, 255, 0.04),
        0 0 0 1px rgba(15, 23, 42, 0.85);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      position: relative;
      z-index: 5;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    
    .brand-link {
      text-decoration: none;
      pointer-events: auto;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      transition: color 0.25s ease;
    }
    body.night-mode .brand-title {
      color: #f8fafc;
    }

    .brand-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background-color: #0f172a;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease;
      opacity: 0.6;
    }
    body.night-mode .brand-title::after {
      background-color: #f8fafc;
    }

    .brand-link:hover .brand-title {
      color: #d8b370;
    }

    .brand-link:hover .brand-title::after {
      transform: scaleX(1);
      background-color: #d8b370;
      opacity: 1;
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
