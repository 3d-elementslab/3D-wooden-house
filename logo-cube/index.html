<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>Elements Lab - 3D Logo Cube Assembly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #8fa0b5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
      transition: background 1.5s cubic-bezier(0.25, 1, 0.5, 1), color 1s ease;
    }

    body.night-mode {
      background: radial-gradient(circle at 50% 30%, #0f1c33 0%, #070d1a 60%, #02050a 100%);
      color: #f1f5f9;
    }

    #starfield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    #starfield.visible {
      opacity: 1;
    }

    #metal-frame {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
      transition: box-shadow 1s ease;
    }
    body.night-mode #metal-frame {
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.22),
        inset 0 0 0 2px rgba(51, 65, 85, 0.5),
        inset 0 0 0 3px rgba(255, 255, 255, 0.04),
        0 0 0 1px rgba(15, 23, 42, 0.85);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      position: relative;
      z-index: 5;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    
    .brand-link {
      text-decoration: none;
      pointer-events: auto;
      display: inline-block;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
      position: relative;
      display: inline-block;
      transition: color 0.25s ease;
    }
    body.night-mode .brand-title {
      color: #f8fafc;
    }

    .brand-title::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 1px;
      background-color: #0f172a;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease;
      opacity: 0.6;
    }
    body.night-mode .brand-title::after {
      background-color: #f8fafc;
    }

    .brand-link:hover .brand-title {
      color: #d8b370;
    }

    .brand-link:hover .brand-title::after {
      transform: scaleX(1);
      background-color: #d8b370;
      opacity: 1;
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #475569;
      margin-top: 0.2rem;
      transition: color 1s ease;
    }
    body.night-mode .brand-sub {
      color: #94a3b8;
    }

    #ui-control-bar {
      position: absolute;
      bottom: 3.8rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
      align-items: center;
      padding: 0.5rem 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(226,232,240,0.7) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 
        0 8px 24px rgba(15, 23, 42, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      z-index: 20;
      transition: background 1s ease, border-color 1s ease, box-shadow 1s ease;
    }
    body.night-mode #ui-control-bar {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.75) 0%, rgba(30, 41, 59, 0.65) 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 12px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    .action-btn {
      width: 135px;
      height: 42px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8fafc;
      background: linear-gradient(180deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid #475569;
      border-bottom: 2px solid #020617;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 
        0 3px 8px rgba(15, 23, 42, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    body.night-mode .action-btn {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 50%, #020617 100%);
      border-color: #334155;
      border-bottom: 2px solid #000000;
    }
    .action-btn:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 50%, #1e293b 100%);
      color: #d8b370;
    }
    .action-btn:active {
      transform: translateY(2px);
      border-bottom: 1px solid #020617;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.3),
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .action-btn.victory-locked {
      color: #d8b370;
      border-color: #d8b370;
      box-shadow: 0 0 16px rgba(216, 179, 112, 0.55);
      cursor: default;
      pointer-events: none;
    }

    #svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.45s ease;
    }
    #svg-overlay img {
      width: 36vw;
      max-width: 360px;
      height: auto;
      transform: translateX(-32px);
      filter: drop-shadow(0 12px 24px rgba(15, 23, 42, 0.15));
    }

    @media (max-width: 768px) {
