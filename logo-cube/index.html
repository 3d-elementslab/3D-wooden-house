  <style>

    body {

<body>
  <canvas id="starfield"></canvas>

  </div>

  </header>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-control-bar">
    <button class="action-btn" id="btn-flyin">FLY IN</button>

  </div>

  <footer>
    <div>© 2026 Elements Lab. All rights reserved.</div>
    <div><a href="https://elementslab.net" class="studio-link" id="studio-link">實驗元素工作室</a></div>
  </footer>

  <audio id="swoosh-audio" src="./rocket-woosh.wav" preload="auto"></audio>
  <audio id="metal-hit-audio" src="./metal-hit.wav" preload="auto"></audio>
  <audio id="cheering-audio" src="./cheering.wav" preload="auto"></audio>

  <script>
    const partRegistry = new Map();
    const activeTweens = [];
    const partOrder = ['E', 'L', 'cube01', 'cube02', 'cube03', 'cube04', 'cube05', 'cube06', 'cube07', 'cube08', 'cube09', 'cube10', 'cube11', 'cube12', 'cube13'];
    const TOTAL_PARTS = 15;
    const HOME_ROTATION = { x: 0.25, y: -0.65 };

    let assembledRoot = null; 

    let assembledCount = 0;
    let playHitIdx = 0;
    let isAssemblyActive = false;
    let isVictoryLocked = false;
    let victoryLockTimer = null;
    let lastActionTime = performance.now();
    let isRoaming = false;
    let roamTime = 0;
    let roamSpeedFactor = 0;

    const starCanvas = document.getElementById('starfield');
    const starCtx = starCanvas.getContext('2d');
    let stars = [];
    let isStarfieldActive = false;

    function resizeStarfield() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
      stars = [];
      const count = Math.floor((starCanvas.width * starCanvas.height) / 2300);

      for (let i = 0; i < count; i++) {
        const sizeRand = Math.random();
        let size = 0.55 + Math.random() * 0.75;
        let type = 'tiny';
        let color = '#ffffff';

        if (sizeRand > 0.96) {
          size = 1.9 + Math.random() * 1.4;
          type = 'giant';
          color = Math.random() > 0.35 ? '#fffbeb' : '#e0f2fe';
        } else if (sizeRand > 0.85) {
          size = 1.05 + Math.random() * 0.65;
          type = 'medium';
        }

        stars.push({
          x: Math.random() * starCanvas.width,
          y: Math.random() * starCanvas.height,
          size: size,
          type: type,
          color: color,
          alpha: Math.random(),
          speed: 0.005 + Math.random() * 0.014
        });
      }
    }

    function drawStars() {
      if (!isStarfieldActive) return;
      starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.15) s.speed = -s.speed;

        starCtx.save();
        starCtx.globalAlpha = Math.max(0.15, Math.min(s.alpha, 1));
        starCtx.fillStyle = s.color;

        if (s.type === 'giant') {
          const flare = s.size * 2.5;
          const grad = starCtx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 1.5);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          starCtx.fillStyle = grad;
          starCtx.beginPath();
          starCtx.arc(s.x, s.y, s.size * 1.5, 0, Math.PI * 2);
          starCtx.fill();

          starCtx.strokeStyle = s.color;
          starCtx.lineWidth = 0.6;
          starCtx.beginPath();
          starCtx.moveTo(s.x - flare, s.y);
          starCtx.lineTo(s.x + flare, s.y);
          starCtx.moveTo(s.x, s.y - flare);
          starCtx.lineTo(s.x, s.y + flare);
          starCtx.stroke();
        } else if (s.type === 'medium') {
          starCtx.shadowBlur = 4;
          starCtx.shadowColor = s.color;
          starCtx.beginPath();
          starCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          starCtx.fill();
        } else {
          starCtx.beginPath();
          starCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          starCtx.fill();
        }
        starCtx.restore();
      }
      requestAnimationFrame(drawStars);
    }

    function setStarfieldVisibility(show) {
      isStarfieldActive = show;
      if (show) {
        resizeStarfield();
        starCanvas.classList.add('visible');
        drawStars();
      } else {
        starCanvas.classList.remove('visible');
      }
    }

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playRocketSwoosh() {
      try {
        getAudioContext();
        const audio = document.getElementById('swoosh-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.65;
          audio.play().catch(() => {});
        }
      } catch (e) {}
    }

    function playMetalHit() {
      try {
        const audio = document.getElementById('metal-hit-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.78;
          audio.play().catch(() => {});
        }
      } catch (e) {}
    }

    function playCheeringAudio() {
      try {
        const audio = document.getElementById('cheering-audio');
        if (audio) {
          audio.currentTime = 0;
          audio.volume = 0.85;
          audio.play().catch(() => {});
        }
      } catch (e) {}
    }

    function playFlyInLockChord() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        const bufferSize = Math.floor(ctx.sampleRate * 0.045);
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.22));
        }
        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = noiseBuffer;

        const bandpass = ctx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.setValueAtTime(2400, now);
        bandpass.Q.setValueAtTime(3.2, now);

        const clickGain = ctx.createGain();
        clickGain.gain.setValueAtTime(0.35, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

        noiseSource.connect(bandpass);
        bandpass.connect(clickGain);
        clickGain.connect(ctx.destination);
        noiseSource.start(now);

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(76, now);
        subOsc.frequency.exponentialRampToValueAtTime(52, now + 0.35);

        subGain.gain.setValueAtTime(0.001, now);
        subGain.gain.linearRampToValueAtTime(0.32, now + 0.015);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);

        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start(now);
        subOsc.stop(now + 0.45);

        const chordFreqs = [587.33, 880.0, 1318.51];
        chordFreqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          const startT = now + 0.04 + idx * 0.035;
          osc.frequency.setValueAtTime(freq, startT);

          gain.gain.setValueAtTime(0.0001, startT);
          gain.gain.linearRampToValueAtTime(0.055 - idx * 0.01, startT + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, startT + 1.15);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startT);
          osc.stop(startT + 1.2);
        });
      } catch (e) {}
    }

    // 建立高級珠寶攝影棚環境反射貼圖
    function buildJewelryStudioEnv(renderer) {
      const envCanvas = document.createElement('canvas');
      envCanvas.width = 512;
      envCanvas.height = 256;
      const ctx = envCanvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 0, 256);
      bgGrad.addColorStop(0.0, '#ffffff');
      bgGrad.addColorStop(0.22, '#9a8462');
      bgGrad.addColorStop(0.50, '#4a3d2b');
      bgGrad.addColorStop(0.75, '#bfa378');
      bgGrad.addColorStop(1.0, '#333b48');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 512, 256);

      const strips = [
        { x: 42, w: 28, alpha: 1.0 },
        { x: 155, w: 22, alpha: 0.95 },
        { x: 260, w: 46, alpha: 1.0 },
        { x: 390, w: 26, alpha: 0.95 }
      ];
      strips.forEach((s) => {
        const g = ctx.createLinearGradient(s.x, 0, s.x + s.w, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.5, `rgba(255, 252, 240, ${s.alpha})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(s.x, 8, s.w, 240);
      });

      const equirectTex = new THREE.CanvasTexture(envCanvas);
      equirectTex.mapping = THREE.EquirectangularReflectionMapping;

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      const envRT = pmremGenerator.fromEquirectangular(equirectTex);
      equirectTex.dispose();
      pmremGenerator.dispose();
      return envRT.texture;
    }

    // 製作金屬拉絲細紋理
    function createBrushedMetalTexture() {
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 256;
      texCanvas.height = 256;
      const ctx = texCanvas.getContext('2d');

      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 256, 256);

      for (let y = 0; y < 256; y++) {
        const shade = Math.floor(90 + Math.random() * 95);
        ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
        ctx.fillRect(0, y, 256, 1);
      }

      const tex = new THREE.CanvasTexture(texCanvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 10);
      return tex;
    }

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const isMobile = window.innerWidth <= 768;
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 200);
    const DEFAULT_CAM_POS = new THREE.Vector3(0, 1.2, 8.2);
    camera.position.copy(DEFAULT_CAM_POS);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const jewelryEnvMap = buildJewelryStudioEnv(renderer);

    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 1.8;  
    controls.maxDistance = 45.0; 
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.42));
    const keyLight = new THREE.DirectionalLight(0xfff8e7, 1.85);
    keyLight.position.set(8, 14, 10);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0xdbeafe, 1.15);
    rimLight.position.set(-10, -4, -9);
    scene.add(rimLight);
    const frontFill = new THREE.DirectionalLight(0xffffff, 0.55);
    frontFill.position.set(-4, 5, 12);
    scene.add(frontFill);

    const brushedRoughnessMap = createBrushedMetalTexture();

    // ★ 這裡把顏色與金屬質感換回我們正確的香檳金與冰河藍高級材質設定
    const asmLetterMat = new THREE.MeshPhysicalMaterial({
      color: 0xd6b06b,
      metalness: 0.92,
      roughness: 0.26,
      roughnessMap: brushedRoughnessMap,
      clearcoat: 0.35,
      clearcoatRoughness: 0.16,
      envMap: jewelryEnvMap,
      envMapIntensity: 1.40
    });

    const asmCubeMat = new THREE.MeshPhysicalMaterial({
      color: 0x6ea6be,
      metalness: 0.68,
      roughness: 0.16,
      clearcoat: 0.90,
      clearcoatRoughness: 0.10,
      envMap: jewelryEnvMap,
      envMapIntensity: 1.35
    });

    const trajectoryMap = {
      'E': new THREE.Vector3(0, 260, 110),
      'L': new THREE.Vector3(0, -260, 110),
      'cube01': new THREE.Vector3(0, 320, 0),
      'cube02': new THREE.Vector3(260, 200, -200),
      'cube03': new THREE.Vector3(-280, -160, -160),
      'cube04': new THREE.Vector3(240, -180, 240),
      'cube05': new THREE.Vector3(-230, 270, -200),
      'cube06': new THREE.Vector3(270, 160, 200),
      'cube07': new THREE.Vector3(-260, -210, 200),
      'cube08': new THREE.Vector3(230, -260, -230),
      'cube09': new THREE.Vector3(-320, 0, 80),
      'cube10': new THREE.Vector3(320, 0, -80),
      'cube11': new THREE.Vector3(0, 80, 320),
      'cube12': new THREE.Vector3(0, -80, -320),
      'cube13': new THREE.Vector3(230, 230, 230)

    function initAssemblyScene(gltf) {
      try {
        const root = gltf.scene;
        const targetPartNames = new Set(partOrder);

        root.updateMatrixWorld(true);
        const assemblyBox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        assemblyBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        const targetScale = ((isMobile ? 2.0 : 2.3) / (maxDim || 1)) * 0.7;
        root.scale.setScalar(targetScale);
        root.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        scaledBox.getCenter(center);
        root.position.sub(center);
        root.updateMatrixWorld(true);

        root.traverse((node) => {
          if (targetPartNames.has(node.name)) {
            const isLogoLetter = (node.name === 'E' || node.name === 'L');
            const solidMat = isLogoLetter ? asmLetterMat : asmCubeMat;

            const meshes = [];
            node.traverse((child) => {
              if (child.isMesh) {
                child.material = solidMat;
                meshes.push(child);
              }
            });

            const targetPos = node.position.clone();
            const deepSpaceDir = trajectoryMap[node.name] || new THREE.Vector3(60, 50, 55);
            const hiddenDeepSpacePos = targetPos.clone().add(deepSpaceDir);

            node.position.copy(hiddenDeepSpacePos);
            node.scale.setScalar(0.85);
            node.visible = false;
            meshes.forEach(m => m.visible = false);

            partRegistry.set(node.name, {
              node: node,
              meshes: meshes,
              isLogoLetter: isLogoLetter,
              targetPos: targetPos,
              deepSpacePos: hiddenDeepSpacePos,
              isAssembled: false
            });
          }
        });

        assembledRoot = root;
        cubeRoot.add(assembledRoot);
        cubeRoot.position.set(0, 0, 0);
        cubeRoot.rotation.set(HOME_ROTATION.x, HOME_ROTATION.y, 0);
      } catch (err) {
        console.error("Assembly Init Error:", err);
      }
    }

    function resetCameraAndPosition(duration = 320) {
      const startCamPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const startCubePos = cubeRoot.position.clone();
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(startCamPos, DEFAULT_CAM_POS, ease);
          controls.target.lerpVectors(startTarget, new THREE.Vector3(0, 0, 0), ease);
          cubeRoot.position.lerpVectors(startCubePos, new THREE.Vector3(0, 0, 0), ease);
          controls.update();
          return t < 1;
        }
      });
    }

    function smoothRotateCubeTo(targetRot, duration = 450, onComplete = null) {
      const startRotX = cubeRoot.rotation.x;
      const startRotY = cubeRoot.rotation.y;
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          cubeRoot.rotation.x = THREE.MathUtils.lerp(startRotX, targetRot.x, ease);
          cubeRoot.rotation.y = THREE.MathUtils.lerp(startRotY, targetRot.y, ease);
          if (t >= 1 && onComplete) onComplete();
          return t < 1;
        }
      });
    }
