<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elements Lab - 3D Logo Cube Assembly</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: #1e293b;
    }

    #metal-frame {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border-radius: 12px;
      pointer-events: none;
      z-index: 100;
      box-shadow: 
        inset 0 0 0 1px rgba(255, 255, 255, 0.8),
        inset 0 0 0 2px rgba(148, 163, 184, 0.6),
        inset 0 0 0 3px rgba(255, 255, 255, 0.3),
        0 0 0 1px rgba(71, 85, 105, 0.3);
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #webgl-canvas:active {
      cursor: grabbing;
    }
    
    header {
      position: absolute;
      top: 1.8rem;
      left: 2rem;
      right: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #0f172a;
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: #64748b;
      margin-top: 0.2rem;
    }

    #ui-control-bar {
      position: absolute;
      bottom: 3.2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.2rem;
      align-items: center;
      padding: 0.5rem 0.8rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(226,232,240,0.7) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 
        0 8px 24px rgba(15, 23, 42, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
      z-index: 20;
    }

    .action-btn {
      width: 135px;
      height: 42px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8fafc;
      background: linear-gradient(180deg, #334155 0%, #1e293b 50%, #0f172a 100%);
      border: 1px solid #475569;
      border-bottom: 2px solid #020617;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 
        0 3px 8px rgba(15, 23, 42, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.12s ease;
    }
    .action-btn:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 50%, #1e293b 100%);
    }
    .action-btn:active {
      transform: translateY(2px);
      border-bottom: 1px solid #020617;
      box-shadow: 
        0 1px 3px rgba(15, 23, 42, 0.3),
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    footer {
      position: absolute;
      bottom: 0.9rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: #64748b;
      pointer-events: none;
      z-index: 10;
      line-height: 1.2;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="metal-frame"></div>

  <header>
    <div>
      <div class="brand-title">ELEMENTS LAB</div>
      <div class="brand-sub">Modular Assembly Simulator</div>
    </div>
  </header>

  <canvas id="webgl-canvas"></canvas>

  <div id="ui-control-bar">
    <button class="action-btn" id="btn-flyin">FLY IN</button>
    <button class="action-btn" id="btn-play">PLAY & HIT</button>
  </div>

  <footer>
    © 2026 Elements Lab. All rights reserved.
  </footer>

  <script>
    // --- 1. 音效引擎 ---
    const AudioEngine = {
      ctx: null,
      snapAudio: null,
      whooshAudio: null,
      dropAudio: null,
      init() {
        try {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          if (!this.snapAudio) {
            this.snapAudio = new Audio('./snap.wav');
            this.snapAudio.onerror = () => { this.snapAudio = new Audio('./snap.mp3'); };
          }
          if (!this.whooshAudio) {
            this.whooshAudio = new Audio('./whoosh.wav');
            this.whooshAudio.onerror = () => { this.whooshAudio = new Audio('./whoosh.mp3'); };
          }
          if (!this.dropAudio) {
            this.dropAudio = new Audio('./drop.wav');
            this.dropAudio.onerror = () => {
              this.dropAudio = new Audio('./dorp.wav');
              this.dropAudio.onerror = () => { this.dropAudio = new Audio('./drop.mp3'); };
            };
          }
        } catch(e) {}
      },
      vibrate(pattern = [25, 10, 35]) {
        try {
          if (typeof navigator !== 'undefined' && navigator.vibrate) {
            navigator.vibrate(pattern);
          }
        } catch(e) {}
      },
      playWhoosh() {
        this.init();
        if (this.whooshAudio) {
          const sound = this.whooshAudio.cloneNode();
          sound.volume = 0.2;
          sound.play().catch(() => {});
        }
      },
      playSnap(isFinalFlyIn = false) {
        this.init();
        if (this.snapAudio) {
          const sound = this.snapAudio.cloneNode();
          sound.volume = isFinalFlyIn ? 0.42 : 0.32;
          sound.play().catch(() => {
            this.playSynthesizedSnap(isFinalFlyIn);
          });
        } else {
          this.playSynthesizedSnap(isFinalFlyIn);
        }
        this.vibrate(isFinalFlyIn ? [35, 15, 50] : [20, 10, 30]);
      },
      playSynthesizedSnap(isFinal) {
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const gainMult = isFinal ? 0.4 : 0.28;

          [2400, 3600].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.25, now + 0.06);

            gain.gain.setValueAtTime((0.15 / (idx + 1)) * gainMult, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.07);
          });

          const bassOsc = this.ctx.createOscillator();
          const bassGain = this.ctx.createGain();
          bassOsc.type = 'sine';
          bassOsc.frequency.setValueAtTime(220, now);
          bassOsc.frequency.exponentialRampToValueAtTime(45, now + 0.12);

          bassGain.gain.setValueAtTime(0.35 * gainMult, now);
          bassGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

          bassOsc.connect(bassGain);
          bassGain.connect(this.ctx.destination);
          bassOsc.start(now);
          bassOsc.stop(now + 0.13);
        } catch(e) {}
      },
      playDropSound() {
        this.init();
        if (this.dropAudio) {
          const sound = this.dropAudio.cloneNode();
          sound.volume = 0.38;
          sound.play().catch(() => {});
        }
      },
      playCrash() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(140, now);
          osc1.frequency.exponentialRampToValueAtTime(30, now + 0.3);
          gain1.gain.setValueAtTime(0.4, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.31);

          this.vibrate([35, 20, 50]);
        } catch(e) {}
      }
    };

    // --- 2. Three.js 場景建構 ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const cubeRoot = new THREE.Group();
    scene.add(cubeRoot);

    const isMobile = window.innerWidth <= 768;
    const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 1.2, 8.2);

    const renderer = new THREE.WebGLRenderer({ 
      canvas, 
      antialias: true, 
      alpha: true, 
      powerPreference: "high-performance" 
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3.5;
    controls.maxDistance = 25;
    controls.target.set(0, 0, 0);

    const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
    keyLight.position.set(10, 15, 10);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x94a3b8, 1.8);
    fillLight.position.set(-10, 4, -8);
    scene.add(fillLight);

    const bottomBounce = new THREE.DirectionalLight(0xe2e8f0, 1.2);
    bottomBounce.position.set(0, -8, 0);
    scene.add(bottomBounce);

    // --- 3. 材質配置 ---
    const champagneGoldMat = new THREE.MeshStandardMaterial({
      color: 0xebd9b4,
      metalness: 0.92,
      roughness: 0.18,
    });

    const anodizedTealMat = new THREE.MeshStandardMaterial({
      color: 0x1e3a5f,
      metalness: 0.45,
      roughness: 0.26,
    });

    const blueprintWireMat = new THREE.LineBasicMaterial({
      color: 0xcbd5e1,
      transparent: true,
      opacity: 0.35
    });

    // --- 4. 零件定向路徑與「面朝鏡頭」穩定旋轉矩陣 ---
    const partRegistry = new Map();
    const activeTweens = [];
    let flyInCount = 0;
    let assembledCount = 0;
    const TOTAL_PARTS = 15;

    const HOME_ROTATION = { x: 0, y: 0 };

    const trajectoryMap = {
      'E': new THREE.Vector3(0, 45, 15),
      'L': new THREE.Vector3(0, -45, 15),
      'cube01': new THREE.Vector3(-45, 30, 30),
      'cube02': new THREE.Vector3(45, 35, -35),
      'cube03': new THREE.Vector3(-50, -25, -25),
      'cube04': new THREE.Vector3(40, -30, 40),
      'cube05': new THREE.Vector3(-35, 45, -30),
      'cube06': new THREE.Vector3(50, 25, 30),
      'cube07': new THREE.Vector3(-45, -35, 30),
      'cube08': new THREE.Vector3(35, -45, -35),
      'cube09': new THREE.Vector3(-55, 0, 10),
      'cube10': new THREE.Vector3(55, 0, -10),
      'cube11': new THREE.Vector3(0, 10, 50),
      'cube12': new THREE.Vector3(0, -10, -50),
      'cube13': new THREE.Vector3(35, 35, 35)
    };

    // 精確定義各面旋轉：避免動態計算出 NaN 導致引擎死當
    const faceRotationMap = {
      'E': { x: 0, y: 0 },
      'L': { x: 0, y: 0 },
      'cube01': { x: 0.35, y: -0.75 },
      'cube02': { x: -0.35, y: 2.35 },
      'cube03': { x: 0.45, y: -2.35 },
      'cube04': { x: 0, y: 1.57 },       // 正正右側
      'cube05': { x: -0.55, y: 0.75 },
      'cube06': { x: 0.55, y: 3.14 },    // 正後側翻轉
      'cube07': { x: 0.35, y: -2.95 },
      'cube08': { x: 0, y: -1.57 },      // 正正左側
      'cube09': { x: 0, y: -1.57 },
      'cube10': { x: 0, y: 1.57 },
      'cube11': { x: 0, y: 0 },          // 正正前
      'cube12': { x: 0, y: 3.14 },       // 正正後
      'cube13': { x: -0.45, y: 0.45 }
    };

    const loader = new THREE.GLTFLoader();
    loader.load(
      './el-logo%20asm.glb',
      (gltf) => { initModelScene(gltf); },
      undefined,
      () => {
        loader.load('./el-logo asm.glb', (gltf) => initModelScene(gltf));
      }
    );

    function initModelScene(gltf) {
      try {
        const root = gltf.scene;
        root.rotation.x = -Math.PI / 2;
        root.updateMatrixWorld(true);

        const originalBox = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        originalBox.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);

        const targetScale = (isMobile ? 2.0 : 2.3) / (maxDim || 1);
        root.scale.setScalar(targetScale);
        root.updateMatrixWorld(true);

        const scaledBox = new THREE.Box3().setFromObject(root);
        const center = new THREE.Vector3();
        scaledBox.getCenter(center);
        root.position.sub(center);
        root.updateMatrixWorld(true);

        cubeRoot.add(root);

        root.traverse((child) => {
          if (child.isMesh) {
            const name = child.name;
            const isLogoLetter = (name === 'E' || name === 'L');

            if (isLogoLetter) {
              child.material = champagneGoldMat.clone();
            } else {
              child.material = anodizedTealMat.clone();
            }

            const targetPos = child.position.clone();

            let wireframe = null;
            if (!isLogoLetter) {
              const edges = new THREE.EdgesGeometry(child.geometry);
              wireframe = new THREE.LineSegments(edges, blueprintWireMat);
              wireframe.position.copy(targetPos);
              wireframe.rotation.copy(child.rotation);
              wireframe.scale.copy(child.scale);
              child.parent.add(wireframe);
            }

            const deepSpaceDir = trajectoryMap[name] || new THREE.Vector3(40, 30, 35);
            const hiddenDeepSpacePos = targetPos.clone().add(deepSpaceDir);

            child.position.copy(hiddenDeepSpacePos);
            child.visible = false;

            partRegistry.set(name, {
              mesh: child,
              targetPos: targetPos,
              deepSpacePos: hiddenDeepSpacePos,
              wireframe: wireframe,
              isAssembled: false
            });
          }
        });

        cubeRoot.rotation.set(HOME_ROTATION.x, HOME_ROTATION.y, 0);
      } catch(err) {
        console.error("Init Error:", err);
      }
    }

    // --- 5. 穩定平滑旋轉 ---
    function smoothRotateCubeTo(targetRot, duration = 380, onComplete = null) {
      const startRotX = cubeRoot.rotation.x;
      const startRotY = cubeRoot.rotation.y;
      const startTime = performance.now();

      activeTweens.push({
        update(now) {
          const t = Math.min((now - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          cubeRoot.rotation.x = THREE.MathUtils.lerp(startRotX, targetRot.x, ease);
          cubeRoot.rotation.y = THREE.MathUtils.lerp(startRotY, targetRot.y, ease);
          if (t >= 1 && onComplete) {
            onComplete();
          }
          return t < 1;
        }
      });
    }

    // --- 6. 飛入與咬合動畫 ---
    function flyInSinglePart(name, isBatch = false, delayMs = 0, isFinalInBatch = false) {
      const item = partRegistry.get(name);
      if (!item || item.isAssembled) return;

      setTimeout(() => {
        item.isAssembled = true;
        item.mesh.visible = true;

        if (!isBatch && faceRotationMap[name]) {
          smoothRotateCubeTo(faceRotationMap[name], 360);
        }

        AudioEngine.playWhoosh();

        const mesh = item.mesh;
        const startPos = item.deepSpacePos.clone();
        const endPos = item.targetPos.clone();
        const startTime = performance.now();
        const duration = isBatch ? 540 : 640;

        activeTweens.push({
          update(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1);
            const ease = t === 1 ? 1 : 1 - Math.pow(2, -8 * t);
            mesh.position.lerpVectors(startPos, endPos, ease);

            if (t >= 1) {
              mesh.position.copy(endPos);

              if (!isBatch) {
                AudioEngine.playSnap(false);
              } else if (isFinalInBatch) {
                AudioEngine.playSnap(true);
              }

              if (mesh.material && mesh.material.emissive) {
                const origEmissive = mesh.material.emissive.getHex();
                mesh.material.emissive.setHex(0x475569);
                setTimeout(() => {
                  mesh.material.emissive.setHex(origEmissive);
                }, 110);
              }

              assembledCount++;

              if (assembledCount === TOTAL_PARTS) {
                smoothRotateCubeTo(HOME_ROTATION, 500);
                checkAssemblyCompletion(isBatch);
              }
              return false;
            }
            return true;
          }
        });
      }, delayMs);
    }

    // --- 7. 第四次惡作劇彩蛋 ---
    function checkAssemblyCompletion(wasBatch) {
      if (wasBatch && flyInCount % 4 === 0) {
        setTimeout(() => {
          triggerPrankDrop('cube11');
        }, 650);
      }
    }

    function triggerPrankDrop(partName) {
      const item = partRegistry.get(partName);
      if (!item) return;

      AudioEngine.playDropSound();

      const mesh = item.mesh;
      const startPos = mesh.position.clone();
      const startTime = performance.now();
      let hasCrashed = false;
      const dropDirection = new THREE.Vector3(0, 0, -1);

      activeTweens.push({
        update(now) {
          const elapsed = (now - startTime) / 1000;
          const fallDistance = 0.5 * 52 * elapsed * elapsed;
          mesh.position.copy(startPos).addScaledVector(dropDirection, fallDistance);

          mesh.rotation.x += 0.12;
          mesh.rotation.y += 0.08;

          if (!hasCrashed && fallDistance > 12) {
            hasCrashed = true;
            AudioEngine.playCrash();
          }

          if (fallDistance > 28) {
            item.isAssembled = false;
            mesh.visible = false;
            mesh.position.copy(item.deepSpacePos);
            mesh.rotation.set(0, 0, 0);
            assembledCount--;
            return false;
          }
          return true;
        }
      });
    }

    // --- 8. 懸浮呼吸漫遊 ---
    let lastActionTime = performance.now();
    let isRoaming = false;
    let roamTime = 0;

    function resetIdleTimer() {
      lastActionTime = performance.now();
      AudioEngine.init();
      if (isRoaming) {
